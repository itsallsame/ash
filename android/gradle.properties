org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# The built-in screen module protocol version (android/screen).
ashScreenVersionCode=11
# The senses helper app (android/senses): location, motion and health. Ash bundles it like the screen helper.
ashSensesVersionCode=3
# The apps shell (android/apps): draws the owner's apps (MCP Apps views), one task and home-screen icon each.
ashAppsVersionCode=8
