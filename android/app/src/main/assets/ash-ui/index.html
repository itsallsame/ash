   Both files are inlined into the page by tools/gen-ui.mjs, tokens first, ahead of the page's own rules. */

/* ---------- 0. Shared variables and the aliases of the page's earlier colour names ---------- */
:root{
  --font:-apple-system,system-ui,"PingFang SC","MiSans","HarmonyOS Sans SC","Noto Sans SC",sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --r-xs:8px; --r-sm:12px; --r-md:16px; --r-lg:20px; --r-xl:28px; --r-pill:999px;
  /* Earlier names, kept so pages not yet moved over take the new colours. New code uses the token names on the right. */
  --fg:var(--text); --mute:var(--text-2); --muted:var(--text-2);
  --me:var(--you); --me-fg:var(--on-you); --accent:var(--you);
  --card:var(--surface); --chip:var(--surface-2); --seg:var(--elev);
  /* --bg --line --ok --warn --err keep their names with the new meaning: --ok/--warn/--err are text tones; for a dot, badge or
     button fill use --ok-fill/--warn-fill/--err-fill. */
}

/* The page's base text: the design's font, text colour, tabular numbers (the design puts these on the screen wrapper). */
body{font-family:var(--font);color:var(--text);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}

/* ---------- 2. Type scale（中文为主，行高偏松） ---------- */
.tx-display{font-size:30px;line-height:38px;font-weight:700;letter-spacing:.01em;color:var(--ink)}
.tx-title{font-size:22px;line-height:30px;font-weight:650;color:var(--ink)}
.tx-headline{font-size:17px;line-height:24px;font-weight:600;color:var(--ink)}
.tx-body{font-size:15px;line-height:24px;color:var(--text)}
.tx-callout{font-size:14px;line-height:21px;color:var(--text-2)}
.tx-sub{font-size:13px;line-height:19px;color:var(--text-2)}
.tx-caption{font-size:11.5px;line-height:16px;color:var(--text-3)}
.tx-num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
/* 颜色工具类优先于组件默认色（例如顶栏状态文字「等你一句话」要是琥珀色） */
.c-her{color:var(--her)!important} .c-you{color:var(--you-text)!important} .c-ok{color:var(--ok)!important} .c-warn{color:var(--warn)!important} .c-err{color:var(--err)!important} .c-2{color:var(--text-2)!important} .c-3{color:var(--text-3)!important}

/* ---------- 3. Icons（24 网格，1.8 线宽，圆头圆角） ---------- */
.i{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.i-s{width:18px;height:18px}.i-xs{width:16px;height:16px;stroke-width:2}.i-l{width:26px;height:26px}
.i-solid{fill:currentColor;stroke:none}

/* ---------- 5. Avatar & presence ---------- */
.av{position:relative;flex:none;display:block}
.av img{width:100%;height:100%;display:block;object-fit:cover;object-position:50% 18%;background:var(--surface-2);border-radius:32%}
.av-28{width:28px;height:28px}.av-36{width:36px;height:36px}.av-40{width:40px;height:40px}.av-56{width:56px;height:56px}.av-88{width:88px;height:88px}.av-120{width:120px;height:120px}
.av-round img{border-radius:50%}
.av .dot{position:absolute;right:-2px;bottom:-2px;width:11px;height:11px;border-radius:50%;border:2.5px solid var(--bg);background:var(--ok-fill)}
.av .dot.off{background:var(--text-3)} .av .dot.warn{background:var(--warn-fill)}
/* 醒着：头像外一圈青色光环缓慢转动（在做事）；呼吸（在想） */
.av-live::before{content:"";position:absolute;inset:-3px;border-radius:36%;padding:1.6px;
  background:conic-gradient(from 0deg,var(--her-fill),transparent 40%,transparent 60%,var(--her-fill));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
  animation:spin 2.4s linear infinite}
.av-breath::before{content:"";position:absolute;inset:-3px;border-radius:36%;border:1.6px solid var(--her-fill);animation:breath 1.8s ease-in-out infinite}
.av-wait::before{content:"";position:absolute;inset:-3px;border-radius:36%;border:1.6px solid var(--warn-fill);animation:breath 1.6s ease-in-out infinite}
.av-letter{display:flex;align-items:center;justify-content:center;border-radius:32%;font-weight:650;color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breath{0%,100%{opacity:.25;transform:scale(.97)}50%{opacity:1;transform:scale(1)}}
@keyframes dots{0%,100%{opacity:.25}50%{opacity:1}}
.a-typing{display:inline-flex;gap:3px;vertical-align:middle}
.a-typing i{width:4px;height:4px;border-radius:50%;background:currentColor;animation:dots 1.2s ease-in-out infinite}
.a-typing i:nth-child(2){animation-delay:.2s}.a-typing i:nth-child(3){animation-delay:.4s}
.spinner{width:14px;height:14px;border-radius:50%;border:2px solid var(--her-soft);border-top-color:var(--her-fill);animation:spin .9s linear infinite;flex:none}

/* ---------- 6. Top bar / tab bar ---------- */
.topbar{height:56px;flex:none;display:flex;align-items:center;gap:10px;padding:0 6px 0 14px}
.topbar .who{display:flex;align-items:center;gap:10px;flex:1;min-width:0;border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left}
.topbar .name{font-size:17px;line-height:22px;font-weight:650;color:var(--ink)}
.topbar .state{font-size:12px;line-height:16px;color:var(--text-2);display:flex;align-items:center;gap:5px;white-space:nowrap}
.state-dot{width:6px;height:6px;border-radius:50%;background:var(--ok-fill);flex:none}
.navbar{height:52px;flex:none;display:flex;align-items:center;gap:4px;padding:0 6px}
.navbar .ttl{flex:1;text-align:center;font-size:17px;font-weight:600;color:var(--ink)}
.iconbtn{width:44px;height:44px;border-radius:50%;border:0;background:none;color:var(--text);display:flex;align-items:center;justify-content:center;flex:none;padding:0;position:relative}
.iconbtn.fill{background:var(--surface-2)}
.badge{position:absolute;top:6px;right:6px;min-width:16px;height:16px;padding:0 4px;box-sizing:border-box;border-radius:8px;background:var(--err-fill);color:#fff;font-size:10.5px;line-height:16px;font-weight:600;text-align:center;border:2px solid var(--bg)}
.tabbar{flex:none;height:58px;padding-bottom:14px;display:flex;border-top:.5px solid var(--line);background:var(--bg)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:none;font:inherit;font-size:11px;color:var(--text-3);padding:6px 0 0}
.tab.on{color:var(--ink);font-weight:600}
.large-title{padding:6px 20px 14px}

/* ---------- 7. Conversation ---------- */
.stream{flex:1;min-height:0;overflow:hidden;padding:4px 14px 10px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 20px);mask-image:linear-gradient(to bottom,transparent 0,#000 20px)}
.daysep{align-self:center;font-size:11.5px;color:var(--text-3);margin:12px 0 6px}
.a-row{display:flex;flex-direction:column;gap:3px}
.a-row-me{align-items:flex-end}
.a-row-her{align-items:flex-start}
.b{max-width:80%;padding:10px 14px;font-size:15.5px;line-height:24px;border-radius:20px;word-break:break-word;box-sizing:border-box}
.b-me{background:var(--bubble-me);color:var(--on-me);border-bottom-right-radius:6px}
.b-her{background:var(--bubble-her);color:var(--text);border-bottom-left-radius:6px;box-shadow:var(--shadow-1)}
.b-her.mid{border-top-left-radius:6px}
.b-me.mid{border-top-right-radius:6px}
.b-wide{max-width:92%}
.meta{font-size:11px;color:var(--text-3);padding:0 6px}
.meta-pending{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--text-2);padding:0 4px}
.byline{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);margin:6px 0 2px 2px}
.gap-s{height:10px;flex:none}
/* markdown in bubble */
.md h4{margin:2px 0 6px;font-size:16px;line-height:24px;font-weight:650;color:var(--ink)}
.md p{margin:0 0 8px}.md p:last-child{margin-bottom:0}
.md ul,.md ol{margin:4px 0 8px;padding-left:20px}.md li{margin:2px 0}
.md b{font-weight:600;color:var(--ink)}
.md code{font-family:var(--mono);font-size:13px;background:var(--code-bg);padding:1px 5px;border-radius:5px}
.md a{color:var(--you-text);text-decoration:none;border-bottom:1px solid currentColor}
.codeblk{margin:6px 0 8px;border-radius:12px;background:var(--code-bg);overflow:hidden;border:1px solid var(--line)}
.codeblk .hd{display:flex;align-items:center;justify-content:space-between;height:32px;padding:0 6px 0 12px;font-size:11.5px;color:var(--text-3);border-bottom:1px solid var(--line)}
.codeblk pre{margin:0;padding:10px 12px;font:12.5px/19px var(--mono);color:var(--text);white-space:pre;overflow:hidden}
.tbl{margin:6px 0 8px;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13.5px;line-height:20px}
.tbl table{border-collapse:collapse;width:100%}
.tbl th{text-align:left;font-weight:600;color:var(--text-2);font-size:12px;background:var(--surface-2);padding:7px 10px}
.tbl td{padding:8px 10px;border-top:1px solid var(--line)}
/* attachments */
.att-img{width:200px;height:150px;border-radius:16px;overflow:hidden;background:var(--surface-3);position:relative}
.att-file{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);min-width:220px;box-sizing:border-box}
.att-file .ic{width:36px;height:36px;border-radius:10px;background:var(--you-soft);color:var(--you-text);display:flex;align-items:center;justify-content:center}

/* ---------- 8. Cards in stream ---------- */
.a-card{width:100%;max-width:330px;box-sizing:border-box;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow-1)}
.card-hd{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600}
.card-hd .chip-ic{width:24px;height:24px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.card-hd .exp{margin-left:auto;font-weight:400;color:var(--text-3);font-size:11.5px}
.card-title{font-size:16px;line-height:23px;font-weight:600;color:var(--ink)}
.card-body{font-size:14px;line-height:21px;color:var(--text-2)}
.card-note{font-size:13px;line-height:19px;color:var(--text-2);background:var(--surface-2);border-radius:12px;padding:9px 11px}
.card-link{display:flex;align-items:center;gap:2px;font-size:13px;color:var(--you-text);border:0;background:none;padding:0;font-family:inherit;align-self:flex-start;min-height:28px}
.card-acts{display:flex;flex-direction:column;gap:8px;margin-top:2px}
.card-acts .two{display:flex;gap:8px}.card-acts .two>*{flex:1}
.resolved{height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13.5px;color:var(--text-2);background:var(--surface-2)}
.resolved.ok{color:var(--ok);background:var(--ok-soft)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{height:40px;padding:0 15px;border-radius:20px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.opt.on{background:var(--you);border-color:var(--you);color:#fff}
.opt.dim{opacity:.4}
.say{display:flex;align-items:center;gap:8px;height:40px;border-radius:20px;background:var(--surface-2);padding:0 6px 0 14px;font-size:14px;color:var(--text-3)}
.say .sbtn{margin-left:auto;width:30px;height:30px;border-radius:50%;background:var(--surface-3);color:var(--text-2);display:flex;align-items:center;justify-content:center}

/* ---------- 9. Buttons ---------- */
.a-btn{height:44px;padding:0 20px;border-radius:22px;border:0;font:inherit;font-size:16px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;box-sizing:border-box}
.btn-primary{background:var(--you);color:var(--on-you)}
.btn-secondary{background:var(--you-soft);color:var(--you-text)}
.btn-neutral{background:var(--surface-2);color:var(--ink)}
.btn-ink{background:var(--ink);color:var(--on-ink)}
.btn-danger{background:var(--err-soft);color:var(--err)}
.btn-ghost{background:none;color:var(--you-text);padding:0 10px}
.btn-sm{height:34px;padding:0 14px;font-size:13.5px;border-radius:17px}
.btn-lg{height:52px;border-radius:26px;font-size:16px}
.btn-block{width:100%}
.a-btn[disabled]{opacity:.4}

/* ---------- 10. Progress pill / chips above composer ---------- */
.dock{flex:none;display:flex;justify-content:center;padding:6px 14px 2px;gap:8px}
.pill{height:32px;border-radius:16px;padding:0 10px 0 10px;background:var(--elev);border:1px solid var(--line);box-shadow:var(--shadow-1);display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-2);white-space:nowrap}
.pill b{font-weight:600;color:var(--ink)}
.ctx{height:30px;border-radius:15px;padding:0 4px 0 12px;background:var(--you-soft);color:var(--you-text);display:inline-flex;align-items:center;gap:4px;font-size:12.5px}

/* ---------- 11. Composer ---------- */
.composer{flex:none;display:flex;align-items:flex-end;gap:8px;padding:8px 10px 24px}
.field{flex:1;min-height:44px;border-radius:22px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 6px 0 5px;box-sizing:border-box}
.field .to{width:34px;height:34px;border-radius:50%;border:0;background:none;padding:0;position:relative;flex:none}
.field .to img{width:28px;height:28px;border-radius:32%;object-fit:cover;object-position:50% 18%;margin:3px}
.field .ph{flex:1;font-size:15px;color:var(--text-3)}
.field .txt{flex:1;font-size:15px;color:var(--text)}
.send{width:44px;height:44px;border-radius:50%;border:0;background:var(--you);color:var(--on-you);display:flex;align-items:center;justify-content:center;flex:none}
.send.idle{background:var(--surface-2);color:var(--text-3)}
.plus{width:44px;height:44px;border-radius:50%;border:0;background:var(--surface-2);color:var(--text);display:flex;align-items:center;justify-content:center;flex:none}

/* ---------- 12. Lists / groups / switch ---------- */
.page{flex:1;min-height:0;overflow:hidden;padding:0 16px 16px;display:flex;flex-direction:column;gap:20px}
.group{display:flex;flex-direction:column;gap:8px}
.group-ttl{font-size:13px;color:var(--text-2);padding:0 6px}
.group-foot{font-size:12px;line-height:18px;color:var(--text-3);padding:0 6px}
.list{background:var(--surface);border-radius:20px;overflow:hidden;box-shadow:var(--shadow-1)}
.li{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 14px;box-sizing:border-box;position:relative}
.li+.li::before{content:"";position:absolute;top:0;left:54px;right:0;height:.5px;background:var(--line)}
.li.noic+.li.noic::before,.list.noic .li::before{left:14px}
.li .lic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--surface-2);color:var(--text)}
.li .lt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.li .lt .t{font-size:15.5px;line-height:22px;color:var(--ink)}
.li .lt .s{font-size:12.5px;line-height:18px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .lv{font-size:14px;color:var(--text-2);white-space:nowrap}
.li .chev{color:var(--text-3)}
.sw{width:46px;height:28px;border-radius:14px;background:var(--surface-3);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw.on{background:var(--ok-fill)}.sw.on::after{left:21px}
.tag{height:22px;padding:0 8px;border-radius:11px;font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.tag-ok{background:var(--ok-soft);color:var(--ok)}.tag-warn{background:var(--warn-soft);color:var(--warn)}.tag-err{background:var(--err-soft);color:var(--err)}.tag-mute{background:var(--surface-2);color:var(--text-2)}.tag-her{background:var(--her-soft);color:var(--her)}.tag-you{background:var(--you-soft);color:var(--you-text)}
.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:3px;gap:2px}
.seg>*{flex:1;height:32px;border-radius:11px;border:0;background:none;font:inherit;font-size:13.5px;color:var(--text-2);display:flex;align-items:center;justify-content:center;gap:4px;position:relative}

/* The design's components inherit the browser's normal line height; the older pages below were written for 1.55. */
header.topbar,#log,.dock,#composerDock,.layer{line-height:normal}
:focus-visible{outline:2px solid var(--you);outline-offset:2px}
/* ---- top bar: her, and the apps ---- */
header.topbar{position:relative;flex:none;z-index:2;height:auto;min-height:calc(56px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);max-width:760px;width:100%;margin:0 auto}
#presence{cursor:pointer;border-radius:var(--r-sm)}
#identity{display:flex;flex-direction:column;min-width:0}
#state,#stateNet{min-height:16px}
#stateNet{display:none}
#presence[data-net=connecting] #state,#presence[data-net=offline] #state{display:none}
#presence[data-net=connecting] #stateNet,#presence[data-net=offline] #stateNet{display:flex}
#presence[data-net=offline] #face{opacity:.55}
.av .dot.gone{display:none}
#presence[data-state=working][data-net=online] #state::before,#stateNet[data-kind=connecting]::before{content:"";flex:none;width:11px;height:11px;border-radius:50%;border:1.6px solid var(--her-soft);border-top-color:var(--her-fill);animation:spin .9s linear infinite}
#stateNet[data-kind=connecting]::before{border-color:var(--surface-3);border-top-color:var(--text-3)}
#presence[data-state=waiting_you][data-net=online] #state::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--warn-fill)}
#presence[data-state=thinking][data-net=online] #state::after{content:"";flex:none;width:4px;height:4px;margin-right:14px;border-radius:50%;background:currentColor;box-shadow:7px 0 currentColor,14px 0 currentColor;animation:dots 1.2s ease-in-out infinite}
#presenceNotice{position:absolute;top:100%;left:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xs);padding:4px 10px;font-size:12px;color:var(--text-2)}
#presenceNotice:empty{display:none}
#netBanner{max-width:732px;width:calc(100% - 28px);margin:0 auto 6px;background:var(--surface-2);color:var(--text-2)}
#netBanner span:last-child{flex:1}
#netBanner .i{color:var(--text-2)}
/* ---- the conversation ---- */
#log{max-width:760px;width:100%;margin:0 auto;overflow-y:auto;overflow-x:hidden;justify-content:flex-start;gap:3px;overscroll-behavior:contain}
#log::before{content:"";flex:1 1 0;min-height:0}
#log>*{flex:none}
.msg{white-space:pre-wrap;overflow-wrap:anywhere;position:relative}
.msg.me{align-self:flex-end}
.msg.ai{align-self:flex-start;white-space:normal}
.msg.ai:has(.md-code-block,.md-table-wrap){max-width:92%}
.msg.run-start{margin-top:15px}
#log>.msg.me:not(.run-start){margin-top:1px}
#log>.msg.ai:not(.run-start){margin-top:0}
.msg.enter,.a-card.enter{animation:rise var(--dur-message) var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.msg.waiting{opacity:.7}
.from{align-self:flex-end;font-size:11.5px;line-height:16px;color:var(--text-3);padding:0 6px}
.delivery.r,.meta-pending.r{align-self:flex-end}
.meta-pending{display:flex;align-items:center;gap:4px}
.byline .av-letter{width:20px;height:20px;font-size:11px;flex:none}
.byline{align-self:flex-start;margin-top:15px}
.fill-her{background:var(--her)}.fill-you{background:var(--you)}.fill-warn{background:var(--warn-fill)}.fill-ok{background:var(--ok-fill)}
.av-letter{color:var(--on-you)}
.expand{display:block;position:relative;margin-top:6px;border:0;background:none;padding:0;color:var(--you-text);font:inherit;font-size:13px;line-height:20px;cursor:pointer}
.expand::after{content:"";position:absolute;inset:-12px -14px}
.reactions{display:flex;gap:4px;margin-top:6px}.reaction{background:var(--surface-2);border-radius:var(--r-pill);padding:0 6px;font-size:13px;line-height:20px}
.atts{display:flex;flex-direction:column;gap:6px}
.atts.me{align-self:flex-end;align-items:flex-end}.atts.ai{align-self:flex-start;align-items:flex-start}
.atts.run-start{margin-top:15px}
.atts img{display:block;max-width:200px;max-height:150px;border-radius:var(--r-md)}
.att-file{cursor:pointer;font:inherit;color:var(--ink);text-align:left;max-width:100%}
.att-file:disabled{opacity:.6}
.att-file .attachment-name,.att-file .card-file-name{font-size:14px;line-height:20px;overflow-wrap:anywhere;min-width:0}
.card-file{width:100%;min-width:0;border:0;background:none;padding:0;min-height:44px}
.daysep{flex:none}
.markdown{white-space:normal;min-width:0;overflow-wrap:anywhere}
.markdown>:first-child{margin-top:0}.markdown>:last-child{margin-bottom:0}
.markdown h1,.markdown h2,.markdown h3,.markdown h4,.markdown h5,.markdown h6{margin:10px 0 6px;font-size:16px;line-height:24px;font-weight:650;color:var(--ink)}
.markdown p{margin:0 0 8px}
.markdown ul,.markdown ol{margin:4px 0 8px;padding-left:20px}.markdown li{margin:2px 0}.markdown li>p{margin:2px 0}.markdown li>ul,.markdown li>ol{margin:2px 0}
.markdown blockquote{margin:8px 0;padding:0 0 0 12px;border-left:3px solid var(--line-2);color:var(--text-2)}
.markdown hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.markdown a{color:var(--you-text);text-decoration:none;border-bottom:1px solid currentColor;overflow-wrap:anywhere}
.markdown strong{font-weight:600;color:var(--ink)}
.markdown pre code{padding:0;border-radius:0;background:none;font-size:inherit;white-space:pre}
.md-code-block{max-width:100%}
.md-code-bar{display:flex;justify-content:space-between;align-items:center}
.md-copy{position:relative;border:0;background:transparent;color:var(--text-3);font:inherit;min-width:28px;min-height:28px;padding:0 6px;cursor:pointer;border-radius:var(--r-xs);display:inline-flex;align-items:center;justify-content:center}
.md-copy::after{content:"";position:absolute;inset:-8px -8px}
.markdown .md-code-block pre{margin:0;padding:10px 12px;overflow-x:auto;tab-size:2}
.md-table-wrap{max-width:100%;overflow-x:auto;overscroll-behavior-x:contain}
.markdown .tbl th,.markdown .tbl td{min-width:5em;max-width:24em;overflow-wrap:normal}
.markdown .tbl th{border-bottom:0}
.markdown .md-task{list-style:none}.md-task input{margin-left:-20px;margin-right:6px;accent-color:var(--you);vertical-align:middle}
.md-image-link{font-size:14px}.md-plain{white-space:pre-wrap}.md-copy-buffer{position:fixed;left:-9999px;top:0;opacity:0}
/* ---- cards in the stream ---- */
#log>.a-card{align-self:flex-start;margin-top:15px}
#log>.a-card+.msg.run-start,#log>.a-card+.a-card{margin-top:15px}
.card-hd{min-height:24px}
.card-hd-text{min-width:0}
.chip-ic{flex:none}
.chip-ic.tile-her{background:var(--her-soft)}.chip-ic.tile-warn{background:var(--warn-soft)}.chip-ic.tile-err{background:var(--err-soft)}.chip-ic.tile-you{background:var(--you-soft)}
.a-card.slim{gap:6px;padding:10px 14px}
.a-card .card-body{white-space:pre-line;overflow-wrap:anywhere}
.a-card .card-body-text{color:var(--text)}
.a-card .card-open{color:var(--ink);text-decoration:none;overflow-wrap:anywhere}
.card-row{display:flex;gap:8px}
.a-card .opt{cursor:pointer;max-width:100%;text-align:left;height:auto;min-height:40px;padding-top:8px;padding-bottom:8px;line-height:21px}
.a-card .opt:disabled:not(.on):not(.dim){opacity:.5}
.say{min-height:40px}
.say .card-custom{flex:1;min-width:0;border:0;background:none;outline:0;color:var(--text);font:inherit;font-size:14px;padding:0}
.say .card-custom::placeholder{color:var(--text-3)}
.say .sbtn{border:0;flex:none;cursor:pointer;padding:0}
.say .sbtn:disabled{opacity:.5}
.a-card .approval-original{margin:0}
.a-card .approval-original summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:2px;min-height:28px;font-size:13px;color:var(--you-text)}
.a-card .approval-original summary::-webkit-details-marker{display:none}
.a-card .approval-original summary::after{content:"";width:6px;height:6px;margin-left:4px;border:solid currentColor;border-width:1.8px 1.8px 0 0;transform:rotate(45deg)}
.a-card .approval-original[open] summary::after{transform:rotate(135deg)}
.a-card .approval-original-text{max-height:50vh;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;unicode-bidi:plaintext;font:12.5px/19px var(--mono);margin:6px 0 0;padding:10px 12px;background:var(--code-bg);border-radius:var(--r-sm);color:var(--text)}
.a-card .card-note{white-space:normal}
.a-card .resolved svg{flex:none}
/* The design sizes some controls under 44px; an invisible margin keeps the touch area at 44px. */
.btn-sm,.opt,.sbtn,.pill,.expand,.suggestion button,.ctx .chip-clear,.context-chip button,.a-card .approval-original summary,.md-copy{position:relative}
.btn-sm::after,.pill::after,.field .to::after{content:"";position:absolute;inset:-5px}
.opt::after{content:"";position:absolute;inset:-4px}
.sbtn::after{content:"";position:absolute;inset:-7px}
.suggestion button::after,.ctx .chip-clear::after,.context-chip button::after{content:"";position:absolute;inset:-8px}
.a-card .approval-original summary::before{content:"";position:absolute;inset:-8px 0}
.a-btn{cursor:pointer}
.card-acts .a-btn{width:100%}
/* ---- loading, empty, first meeting ---- */
.sk{flex:none}
.sk-her-s{width:58%;height:44px;border-radius:var(--r-lg) var(--r-lg) var(--r-lg) 6px}
.sk-her-l{width:74%;height:92px;border-radius:var(--r-lg) var(--r-lg) var(--r-lg) 6px}
.sk-me-s{align-self:flex-end;width:46%;height:44px;border-radius:var(--r-lg) var(--r-lg) 6px var(--r-lg)}
.sk-her-m{width:66%;height:68px;border-radius:var(--r-lg) var(--r-lg) var(--r-lg) 6px}
.sk-me-m{align-self:flex-end;width:52%;height:44px;border-radius:var(--r-lg) var(--r-lg) 6px var(--r-lg)}
#log:has(>.sk){gap:10px}
#log:has(>.empty){padding:0}
#log:has(>.empty)::before{display:none}
#log>.empty{flex:1}
.empty-examples{display:flex;flex-direction:column;gap:6px;margin-top:4px;font-size:14px;line-height:21px;color:var(--text-2)}
.intro{display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 0 18px}
/* ---- over the composer ---- */
.dock[hidden]{display:none}
.dock:empty{display:none}
#progress .pill{cursor:pointer;font:inherit;font-size:12.5px}
.pill .pill-time{color:var(--text-2)}
.pill .i{color:var(--text-3)}
.context-chip button,.ctx .chip-clear{border:0;background:none;color:inherit;font:inherit;font-size:12.5px;min-width:28px;min-height:28px;padding:0 6px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r-pill)}
.suggestion button{border:0;background:none;color:inherit;font:inherit;font-size:12.5px;min-height:28px;padding:0 8px;cursor:pointer}
#suggestions:empty{display:none}
#suggestions{display:flex;justify-content:center;padding:6px 14px 2px;max-width:760px;margin:0 auto;width:100%}
.suggestion{height:auto;min-height:30px;padding:0 4px 0 12px}
#composerDock{flex:none;max-width:760px;width:100%;margin:0 auto}
.composer{padding-bottom:max(24px,env(safe-area-inset-bottom))}
.field textarea{flex:1;min-width:0;max-height:40vh;resize:none;border:0;background:none;outline:0;color:var(--text);font:inherit;font-size:15px;line-height:24px;padding:9px 0;margin:0;align-self:center}
.field textarea::placeholder{color:var(--text-3)}
.field{align-items:flex-end;min-width:0}
.field textarea{width:100%}
.field .to{align-self:flex-end;margin-bottom:4px;cursor:pointer}
.field .to img{display:block}
.field .to .to-letter{width:28px;height:28px;margin:3px;font-size:14px}
.plus,.send{cursor:pointer}
.send:disabled{opacity:.5}
/* ---- sheets over the page: who to talk to, what to attach ---- */
.layer{position:fixed;inset:0;z-index:4}
.layer .scrim{animation:fade var(--dur-sheet) var(--ease)}
.layer .sheet{max-width:760px;margin:0 auto;padding-bottom:max(28px,env(safe-area-inset-bottom));animation:slide var(--dur-sheet) var(--ease)}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateY(100%)}}
.layer .list{box-shadow:none;background:var(--surface-2)}
.layer .li{width:100%;border:0;background:none;font:inherit;color:inherit;text-align:left;cursor:pointer}
.layer .li:disabled{opacity:.5;cursor:default}
.layer .li .av-letter{width:40px;height:40px;font-size:17px}
.layer .li .chev-on{color:var(--you-text)}
.layer .li .dot{border-color:var(--surface-2)}
.layer .li.sk-row{height:56px;cursor:default}
.layer .li.sheet-note{color:var(--text-2);font-size:14px}
.attach-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:6px 0 4px}
.attach-choice{display:flex;flex-direction:column;align-items:center;gap:8px;border:0;background:none;font:inherit;font-size:13px;color:var(--text);cursor:pointer;min-height:44px}
.attach-tile{width:60px;height:60px;border-radius:var(--r-lg);background:var(--surface-2);display:flex;align-items:center;justify-content:center}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* The file reader (files.js) still draws its buttons and notes with these. */
.btn{border:0;border-radius:8px;padding:.35rem .9rem;font:inherit;font-size:.9rem;cursor:pointer;background:var(--me);color:var(--on-you);margin:.2rem .4rem .2rem 0}
.btn.gray{background:var(--chip);color:var(--fg)}.btn.red{background:var(--err-fill)}
.muted{color:var(--mute);font-size:.82rem}
.files-view{position:fixed;inset:0;width:100%;max-width:960px;height:100%;max-height:100%;margin:auto;border:0;padding:0;background:var(--bg);color:var(--fg);overscroll-behavior:contain}
.files-view[open]{display:flex;flex-direction:column}.files-view::backdrop{background:#0008}
.files-bar{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;padding:calc(.7rem + env(safe-area-inset-top)) .9rem .7rem;border-bottom:1px solid var(--line)}
.files-bar strong{flex:1 1 10rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:1rem}.files-actions{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-left:auto}.files-actions select{max-width:190px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:.5rem}
.files-note{padding:.5rem 1rem;color:var(--mute);font-size:.8rem;overflow-wrap:anywhere}
.files-body{flex:1;min-height:0;overflow:auto;padding:1rem;padding-bottom:calc(1rem + env(safe-area-inset-bottom))}.files-row{display:flex;width:100%;text-align:left;gap:1rem;justify-content:space-between;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--fg);font:inherit;padding:.95rem .2rem;cursor:pointer}.files-row span{overflow-wrap:anywhere}.files-row small{color:var(--mute);white-space:nowrap}
.files-html{width:100%;height:100%;min-height:60vh;border:0;background:white}.files-image{max-width:100%;height:auto;display:block;margin:auto}.files-text{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.9rem}.files-body .markdown{max-width:780px;margin:auto}.files-bar .btn{font-size:.85rem;padding:.45rem .65rem}
</style>
</head>
<body>
<header class="topbar">
  <button id="presence" class="who" type="button" aria-label="打开 Ash 的主页"><span id="face" class="av av-36"><img class="face" src="avatars/default.webp" alt=""><span id="dot" class="dot gone"></span></span><span id="identity"><span id="title" class="name">Ash</span><span id="state" class="state">状态待同步</span><span id="stateNet" class="state" data-kind="connecting">连接中…</span></span></button><select id="agents" hidden></select>
  <span id="connection" class="sr-only" role="status">连接中…</span><span id="presenceNotice" role="status"></span>
  <button id="apps" class="iconbtn" type="button" aria-label="应用"></button>
</header>
<div id="netBanner" class="banner" role="status" hidden><span id="netBannerIcon"></span><span id="netBannerText"></span></div>
<main id="log" class="stream" aria-busy="true"></main>
<div id="historyNav" class="dock" hidden><button id="returnLatest" class="a-btn btn-ghost btn-sm" type="button">回到最新</button></div>
<div id="progress" class="dock" hidden aria-live="polite"></div>
<div id="context" class="dock" hidden></div>
<div id="selected" class="dock" hidden></div>
