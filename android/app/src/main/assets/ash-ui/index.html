/* Ash web components. Source: design/app/ash.css (the designer's reference), made usable in the page:

     everything else keeps the design's name
   Both files are inlined into the page by tools/gen-ui.mjs, tokens first, ahead of the page's own rules. */

/* ---------- 0. Shared variables and the aliases of the page's earlier colour names ---------- */
:root{
  --font:-apple-system,system-ui,"PingFang SC","MiSans","HarmonyOS Sans SC","Noto Sans SC",sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --r-xs:8px; --r-sm:12px; --r-md:16px; --r-lg:20px; --r-xl:28px; --r-pill:999px;
  /* Earlier names, kept so pages not yet moved over take the new colours. New code uses the token names on the right. */
  --fg:var(--text); --mute:var(--text-2); --muted:var(--text-2);
  --me:var(--you); --me-fg:var(--on-you); --accent:var(--you);
  --card:var(--surface); --chip:var(--surface-2); --seg:var(--elev);
  /* --bg --line --ok --warn --err keep their names with the new meaning: --ok/--warn/--err are text tones; for a dot, badge or
     button fill use --ok-fill/--warn-fill/--err-fill. */
}

/* The page's base text: the design's font, text colour, tabular numbers (the design puts these on the screen wrapper). */
body{font-family:var(--font);color:var(--text);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}

/* ---------- 2. Type scale（中文为主，行高偏松） ---------- */
.tx-display{font-size:30px;line-height:38px;font-weight:700;letter-spacing:.01em;color:var(--ink)}
.tx-title{font-size:22px;line-height:30px;font-weight:650;color:var(--ink)}
.tx-headline{font-size:17px;line-height:24px;font-weight:600;color:var(--ink)}
.tx-body{font-size:15px;line-height:24px;color:var(--text)}
.tx-callout{font-size:14px;line-height:21px;color:var(--text-2)}
.tx-sub{font-size:13px;line-height:19px;color:var(--text-2)}
.tx-caption{font-size:11.5px;line-height:16px;color:var(--text-3)}
.tx-num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
/* 颜色工具类优先于组件默认色（例如顶栏状态文字「等你一句话」要是琥珀色） */
.c-her{color:var(--her)!important} .c-you{color:var(--you-text)!important} .c-ok{color:var(--ok)!important} .c-warn{color:var(--warn)!important} .c-err{color:var(--err)!important} .c-2{color:var(--text-2)!important} .c-3{color:var(--text-3)!important}

/* ---------- 3. Icons（24 网格，1.8 线宽，圆头圆角） ---------- */
.i{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.i-s{width:18px;height:18px}.i-xs{width:16px;height:16px;stroke-width:2}.i-l{width:26px;height:26px}
.i-solid{fill:currentColor;stroke:none}

/* ---------- 5. Avatar & presence ---------- */
.av{position:relative;flex:none;display:block}
.av img{width:100%;height:100%;display:block;object-fit:cover;object-position:50% 18%;background:var(--surface-2);border-radius:32%}
.av-28{width:28px;height:28px}.av-36{width:36px;height:36px}.av-40{width:40px;height:40px}.av-56{width:56px;height:56px}.av-88{width:88px;height:88px}.av-120{width:120px;height:120px}
.av-round img{border-radius:50%}
.av .dot{position:absolute;right:-2px;bottom:-2px;width:11px;height:11px;border-radius:50%;border:2.5px solid var(--bg);background:var(--ok-fill)}
.av .dot.off{background:var(--text-3)} .av .dot.warn{background:var(--warn-fill)}
/* 醒着：头像外一圈青色光环缓慢转动（在做事）；呼吸（在想） */
.av-live::before{content:"";position:absolute;inset:-3px;border-radius:36%;padding:1.6px;
  background:conic-gradient(from 0deg,var(--her-fill),transparent 40%,transparent 60%,var(--her-fill));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
  animation:spin 2.4s linear infinite}
.av-breath::before{content:"";position:absolute;inset:-3px;border-radius:36%;border:1.6px solid var(--her-fill);animation:breath 1.8s ease-in-out infinite}
.av-wait::before{content:"";position:absolute;inset:-3px;border-radius:36%;border:1.6px solid var(--warn-fill);animation:breath 1.6s ease-in-out infinite}
.av-letter{display:flex;align-items:center;justify-content:center;border-radius:32%;font-weight:650;color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breath{0%,100%{opacity:.25;transform:scale(.97)}50%{opacity:1;transform:scale(1)}}
@keyframes dots{0%,100%{opacity:.25}50%{opacity:1}}
.a-typing{display:inline-flex;gap:3px;vertical-align:middle}
.a-typing i{width:4px;height:4px;border-radius:50%;background:currentColor;animation:dots 1.2s ease-in-out infinite}
.a-typing i:nth-child(2){animation-delay:.2s}.a-typing i:nth-child(3){animation-delay:.4s}
.spinner{width:14px;height:14px;border-radius:50%;border:2px solid var(--her-soft);border-top-color:var(--her-fill);animation:spin .9s linear infinite;flex:none}

/* ---------- 6. Top bar / tab bar ---------- */
.topbar{height:56px;flex:none;display:flex;align-items:center;gap:10px;padding:0 6px 0 14px}
.topbar .who{display:flex;align-items:center;gap:10px;flex:1;min-width:0;border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left}
.topbar .name{font-size:17px;line-height:22px;font-weight:650;color:var(--ink)}
.topbar .state{font-size:12px;line-height:16px;color:var(--text-2);display:flex;align-items:center;gap:5px;white-space:nowrap}
.state-dot{width:6px;height:6px;border-radius:50%;background:var(--ok-fill);flex:none}
.navbar{height:52px;flex:none;display:flex;align-items:center;gap:4px;padding:0 6px}
.navbar .ttl{flex:1;text-align:center;font-size:17px;font-weight:600;color:var(--ink)}
.iconbtn{width:44px;height:44px;border-radius:50%;border:0;background:none;color:var(--text);display:flex;align-items:center;justify-content:center;flex:none;padding:0;position:relative}
.iconbtn.fill{background:var(--surface-2)}
.badge{position:absolute;top:6px;right:6px;min-width:16px;height:16px;padding:0 4px;box-sizing:border-box;border-radius:8px;background:var(--err-fill);color:#fff;font-size:10.5px;line-height:16px;font-weight:600;text-align:center;border:2px solid var(--bg)}
.tabbar{flex:none;height:58px;padding-bottom:14px;display:flex;border-top:.5px solid var(--line);background:var(--bg)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:none;font:inherit;font-size:11px;color:var(--text-3);padding:6px 0 0}
.tab.on{color:var(--ink);font-weight:600}
.large-title{padding:6px 20px 14px}

/* ---------- 7. Conversation ---------- */
.stream{flex:1;min-height:0;overflow:hidden;padding:4px 14px 10px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 20px);mask-image:linear-gradient(to bottom,transparent 0,#000 20px)}
.daysep{align-self:center;font-size:11.5px;color:var(--text-3);margin:12px 0 6px}
.a-row{display:flex;flex-direction:column;gap:3px}
.a-row-me{align-items:flex-end}
.a-row-her{align-items:flex-start}
.b{max-width:80%;padding:10px 14px;font-size:15.5px;line-height:24px;border-radius:20px;word-break:break-word;box-sizing:border-box}
.b-me{background:var(--bubble-me);color:var(--on-me);border-bottom-right-radius:6px}
.b-her{background:var(--bubble-her);color:var(--text);border-bottom-left-radius:6px;position:relative;z-index:0}
/* Equal shadow radii avoid WebView's per-tile blur textures; the bubble keeps its small corners. */
.b-her::before{content:"";position:absolute;inset:0;border-radius:20px;box-shadow:var(--shadow-1);pointer-events:none;z-index:-1}
.b-her.mid{border-top-left-radius:6px}
.b-me.mid{border-top-right-radius:6px}
.b-wide{max-width:92%}
.meta{font-size:11px;color:var(--text-3);padding:0 6px}
.meta-pending{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--text-2);padding:0 4px}
.byline{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);margin:6px 0 2px 2px}
.gap-s{height:10px;flex:none}
/* markdown in bubble */
.md h4{margin:2px 0 6px;font-size:16px;line-height:24px;font-weight:650;color:var(--ink)}
.md p{margin:0 0 8px}.md p:last-child{margin-bottom:0}
.md ul,.md ol{margin:4px 0 8px;padding-left:20px}.md li{margin:2px 0}
.md b{font-weight:600;color:var(--ink)}
.md code{font-family:var(--mono);font-size:13px;background:var(--code-bg);padding:1px 5px;border-radius:5px}
.md a{color:var(--you-text);text-decoration:none;border-bottom:1px solid currentColor}
.codeblk{margin:6px 0 8px;border-radius:12px;background:var(--code-bg);overflow:hidden;border:1px solid var(--line)}
.codeblk .hd{display:flex;align-items:center;justify-content:space-between;height:32px;padding:0 6px 0 12px;font-size:11.5px;color:var(--text-3);border-bottom:1px solid var(--line)}
.codeblk pre{margin:0;padding:10px 12px;font:12.5px/19px var(--mono);color:var(--text);white-space:pre;overflow:hidden}
.tbl{margin:6px 0 8px;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13.5px;line-height:20px}
.tbl table{border-collapse:collapse;width:100%}
.tbl th{text-align:left;font-weight:600;color:var(--text-2);font-size:12px;background:var(--surface-2);padding:7px 10px}
.tbl td{padding:8px 10px;border-top:1px solid var(--line)}
/* attachments */
.att-img{width:200px;height:150px;border-radius:16px;overflow:hidden;background:var(--surface-3);position:relative}
.att-file{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);min-width:220px;box-sizing:border-box}
.att-file .ic{width:36px;height:36px;border-radius:10px;background:var(--you-soft);color:var(--you-text);display:flex;align-items:center;justify-content:center}

/* ---------- 8. Cards in stream ---------- */
.a-card{width:100%;max-width:330px;box-sizing:border-box;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow-1)}
.card-hd{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600}
.card-hd .chip-ic{width:24px;height:24px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.card-hd .exp{margin-left:auto;font-weight:400;color:var(--text-3);font-size:11.5px}
.card-title{font-size:16px;line-height:23px;font-weight:600;color:var(--ink)}
.card-body{font-size:14px;line-height:21px;color:var(--text-2)}
.card-note{font-size:13px;line-height:19px;color:var(--text-2);background:var(--surface-2);border-radius:12px;padding:9px 11px}
.card-link{display:flex;align-items:center;gap:2px;font-size:13px;color:var(--you-text);border:0;background:none;padding:0;font-family:inherit;align-self:flex-start;min-height:28px}
.card-acts{display:flex;flex-direction:column;gap:8px;margin-top:2px}
.card-acts .two{display:flex;gap:8px}.card-acts .two>*{flex:1}
.resolved{height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13.5px;color:var(--text-2);background:var(--surface-2)}
.resolved.ok{color:var(--ok);background:var(--ok-soft)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{height:40px;padding:0 15px;border-radius:20px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.opt.on{background:var(--you);border-color:var(--you);color:#fff}
.opt.dim{opacity:.4}
.say{display:flex;align-items:center;gap:8px;height:40px;border-radius:20px;background:var(--surface-2);padding:0 6px 0 14px;font-size:14px;color:var(--text-3)}
.say .sbtn{margin-left:auto;width:30px;height:30px;border-radius:50%;background:var(--surface-3);color:var(--text-2);display:flex;align-items:center;justify-content:center}

/* ---------- 9. Buttons ---------- */
.a-btn{height:44px;padding:0 20px;border-radius:22px;border:0;font:inherit;font-size:16px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;box-sizing:border-box}
.btn-primary{background:var(--you);color:var(--on-you)}
.btn-secondary{background:var(--you-soft);color:var(--you-text)}
.btn-neutral{background:var(--surface-2);color:var(--ink)}
.btn-ink{background:var(--ink);color:var(--on-ink)}
.btn-danger{background:var(--err-soft);color:var(--err)}
.btn-ghost{background:none;color:var(--you-text);padding:0 10px}
.btn-sm{height:34px;padding:0 14px;font-size:13.5px;border-radius:17px}
.btn-lg{height:52px;border-radius:26px;font-size:16px}
.btn-block{width:100%}
.a-btn[disabled]{opacity:.4}

/* ---------- 10. Progress pill / chips above composer ---------- */
.dock{flex:none;display:flex;justify-content:center;padding:6px 14px 2px;gap:8px}
.pill{height:32px;border-radius:16px;padding:0 10px 0 10px;background:var(--elev);border:1px solid var(--line);box-shadow:var(--shadow-1);display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-2);white-space:nowrap}
.pill b{font-weight:600;color:var(--ink)}
.ctx{height:30px;border-radius:15px;padding:0 4px 0 12px;background:var(--you-soft);color:var(--you-text);display:inline-flex;align-items:center;gap:4px;font-size:12.5px}

/* ---------- 11. Composer ---------- */
.composer{flex:none;display:flex;align-items:flex-end;gap:8px;padding:8px 10px 24px}
.field{flex:1;min-height:44px;border-radius:22px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 6px 0 5px;box-sizing:border-box}
.field .to{width:34px;height:34px;border-radius:50%;border:0;background:none;padding:0;position:relative;flex:none}
.field .to img{width:28px;height:28px;border-radius:32%;object-fit:cover;object-position:50% 18%;margin:3px}
.field .ph{flex:1;font-size:15px;color:var(--text-3)}
.field .txt{flex:1;font-size:15px;color:var(--text)}
.send{width:44px;height:44px;border-radius:50%;border:0;background:var(--you);color:var(--on-you);display:flex;align-items:center;justify-content:center;flex:none}
.send.idle{background:var(--surface-2);color:var(--text-3)}
.plus{width:44px;height:44px;border-radius:50%;border:0;background:var(--surface-2);color:var(--text);display:flex;align-items:center;justify-content:center;flex:none}

/* ---------- 12. Lists / groups / switch ---------- */
.page{flex:1;min-height:0;overflow:hidden;padding:0 16px 16px;display:flex;flex-direction:column;gap:20px}
.group{display:flex;flex-direction:column;gap:8px}
.group-ttl{font-size:13px;color:var(--text-2);padding:0 6px}
.group-foot{font-size:12px;line-height:18px;color:var(--text-3);padding:0 6px}
.list{background:var(--surface);border-radius:20px;overflow:hidden;box-shadow:var(--shadow-1)}
.li{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 14px;box-sizing:border-box;position:relative}
.li+.li::before{content:"";position:absolute;top:0;left:54px;right:0;height:.5px;background:var(--line)}
.li.noic+.li.noic::before,.list.noic .li::before{left:14px}
.li .lic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--surface-2);color:var(--text)}
.li .lt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.li .lt .t{font-size:15.5px;line-height:22px;color:var(--ink)}
.li .lt .s{font-size:12.5px;line-height:18px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .lv{font-size:14px;color:var(--text-2);white-space:nowrap}
.li .chev{color:var(--text-3)}
.sw{width:46px;height:28px;border-radius:14px;background:var(--surface-3);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw.on{background:var(--ok-fill)}.sw.on::after{left:21px}
.tag{height:22px;padding:0 8px;border-radius:11px;font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.tag-ok{background:var(--ok-soft);color:var(--ok)}.tag-warn{background:var(--warn-soft);color:var(--warn)}.tag-err{background:var(--err-soft);color:var(--err)}.tag-mute{background:var(--surface-2);color:var(--text-2)}.tag-her{background:var(--her-soft);color:var(--her)}.tag-you{background:var(--you-soft);color:var(--you-text)}
.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:3px;gap:2px}
.seg>*{flex:1;height:32px;border-radius:11px;border:0;background:none;font:inherit;font-size:13.5px;color:var(--text-2);display:flex;align-items:center;justify-content:center;gap:4px;position:relative}
.seg>.on{background:var(--elev);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.under{display:flex;gap:22px;padding:0 20px;border-bottom:.5px solid var(--line)}
.under>*{height:42px;display:flex;align-items:center;font-size:15px;color:var(--text-2);position:relative;gap:4px}
.under>.on{color:var(--ink);font-weight:600}
.under>.on::after{content:"";position:absolute;left:50%;bottom:-.5px;width:18px;height:3px;margin-left:-9px;border-radius:2px;background:var(--ink)}
.cnt{min-width:16px;height:16px;padding:0 4px;box-sizing:border-box;border-radius:8px;background:var(--err-fill);color:#fff;font-size:10.5px;line-height:16px;font-weight:600;text-align:center}

/* ---------- 13. Sheet / scrim / toast / empty / skeleton ---------- */
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--elev);border-radius:28px 28px 0 0;padding:8px 16px 28px;box-shadow:var(--shadow-2);display:flex;flex-direction:column;gap:12px}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--line-2);align-self:center;margin-bottom:4px}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:140px;height:38px;padding:0 16px;border-radius:19px;background:var(--ink);color:var(--on-ink);font-size:13.5px;display:flex;align-items:center;gap:8px;white-space:nowrap;box-shadow:var(--shadow-2)}
.banner{flex:none;margin:0 14px 6px;padding:9px 12px;border-radius:14px;display:flex;align-items:center;gap:8px;font-size:13px}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:0 40px}
.sk{background:var(--surface-2);border-radius:8px;position:relative;overflow:hidden}
.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:shimmer 1.6s infinite}
@media (prefers-color-scheme:dark){.sk::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.05),transparent)}}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.hr{height:.5px;background:var(--line);flex:none}

@media (prefers-reduced-motion:reduce){.av-live::before,.av-breath::before,.av-wait::before,.a-typing i,.spinner,.sk::after{animation:none}}

/* 滚动区里的直接子元素不被压缩，超出部分就是「还能往下滑」 */
.page>*,.stream>*{flex-shrink:0}

/* The design draws these with the browser's default box model (padding and border outside the stated size); the page's
   `* { box-sizing: border-box }` would make them smaller than the reference. */
.spinner,.pill,.av .dot,.codeblk .hd{box-sizing:content-box}

/* 点击区不小于 44：设计稿里这几样控件小于 44（头像 34、选项 40、小按钮 34、分段 32、链接 28、「她」38、发送 30、胶囊 34），
   可见尺寸不变，用不可见的伪元素把可点的范围向外扩到 44；只往外扩到相邻控件之间的空隙里，不盖住它们。 */
.field .to,.opt,.btn-sm,.seg>*,.card-link,.topbar .who,.say .sbtn,.pill{position:relative}
.field .to::after{content:"";position:absolute;inset:-5px}
.pill::after{content:"";position:absolute;left:-6px;right:-6px;top:-6px;bottom:-6px}
.btn-sm::after{content:"";position:absolute;left:0;right:0;top:-5px;bottom:-5px}
/* an absolute offset is measured from the padding edge, inside the 1px border: -3px reaches 2px beyond the button */
.opt::after{content:"";position:absolute;left:0;right:0;top:-3px;bottom:-3px}
.seg>*::after{content:"";position:absolute;left:0;right:0;top:-6px;bottom:-6px}
.card-link::after{content:"";position:absolute;left:0;right:0;top:-8px;bottom:-8px}
.topbar .who::after{content:"";position:absolute;left:0;right:0;top:-3px;bottom:-3px}
.say .sbtn::after{content:"";position:absolute;inset:-7px}
/* 她的主页 and its pages. Colours are tokens (ash-tokens.css), components are ash-ui.css's; this file lays them out the way
   design/app/reference/Home.html and HomePages.html do. Inlined into the page by tools/gen-ui.mjs. */

/* ---------- the layer and its pages ---------- */
.hm-root{position:fixed;inset:0;z-index:40;background:var(--bg);color:var(--text);font-family:var(--font);display:flex;flex-direction:column;overflow:hidden;
  transition:transform 360ms var(--ease),opacity 360ms var(--ease)}
.hm-root[hidden],.hm-root [hidden]{display:none!important}
.hm-root.closing{transform:translateY(24px);opacity:0}
.hm-banner{margin-top:8px;background:var(--warn-soft);color:var(--warn)}
.hm-stage{position:relative;flex:1;min-height:0}
.hm-screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);padding-top:env(safe-area-inset-top);
  transition:transform 360ms var(--ease),opacity 360ms var(--ease)}
.hm-screen.entering{transform:translateX(32px);opacity:0}
.hm-screen.leaving{transform:translateX(32px);opacity:0;pointer-events:none}
.hm-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.hm-col{max-width:560px;margin:0 auto;padding:0 16px;display:flex;flex-direction:column;gap:20px}
.hm-navgap{width:44px;flex:none}
.hm-root .navbar{max-width:592px;width:100%;margin:0 auto;box-sizing:border-box}
.hm-root button{font-family:inherit}
.hm-root .tap{cursor:pointer;border:0;background:none;text-align:left;font:inherit;color:inherit;width:100%}
.hm-root .tap:focus-visible,.hm-root .hm-stat:focus-visible,.hm-root .hm-cell:focus-visible,.hm-root .hm-when:focus-visible,.hm-root button:focus-visible{outline:2px solid var(--you);outline-offset:2px}
.hm-root .hm-more{display:flex;align-items:center}
.hm-note{margin:0;padding:0 6px;font-size:13px;line-height:19px;color:var(--text-2)}
.hm-actions{display:flex;gap:8px;flex-wrap:wrap}
.hm-confirm{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:16px;background:var(--surface-2)}
.hm-root input,.hm-root textarea,.hm-root select{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;box-sizing:border-box;width:100%}
.hm-root textarea{min-height:120px;line-height:24px;resize:vertical}
.hm-root input:focus,.hm-root textarea:focus,.hm-root select:focus{outline:2px solid var(--you);outline-offset:0}
.hm-root .li.tap{width:100%}
.hm-root .li-tall{min-height:64px}
.hm-root .lic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--surface-2);color:var(--text)}
.hm-root .lic-warn{background:var(--warn-soft);color:var(--warn)}.hm-root .lic-her{background:var(--her-soft);color:var(--her)}.hm-root .lic-ok{background:var(--ok-soft);color:var(--ok)}.hm-root .lic-you{background:var(--you-soft);color:var(--you-text)}.hm-root .lic-err{background:var(--err-soft);color:var(--err)}
.hm-root .a-btn{cursor:pointer}
.hm-root .a-btn.armed{background:var(--err-soft);color:var(--err)}
.hm-sk{display:block;height:16px;width:60%}

/* ---------- home ---------- */
.hm-home{position:relative}
.hm-glow{position:absolute;left:50%;top:0;width:420px;height:320px;margin-left:-210px;background:radial-gradient(closest-side,var(--her-soft),transparent);pointer-events:none}
.hm-hero{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:2px 4px 22px}
.hm-avatar{width:104px;height:104px}
.hm-avatar.off{opacity:.55}
.hm-avatar.av-letter{display:flex;align-items:center;justify-content:center}
.hm-avatar .hm-letter{font-size:44px;font-weight:700}
.hm-name{font-size:28px;line-height:36px;font-weight:700;color:var(--ink);margin-top:6px}
.hm-state{height:28px;padding:0 12px;font-size:13px;gap:6px}
.hm-spin{width:11px;height:11px}
.hm-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;margin-top:14px}
.hm-stat{background:var(--surface);border:0;border-radius:18px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:var(--shadow-1);min-height:44px;cursor:pointer;color:inherit}
.hm-stat-n{font-size:22px;line-height:28px;font-weight:700;color:var(--ink)}
.hm-blocks{position:relative;display:flex;flex-direction:column;gap:26px}
.hm-section{display:flex;flex-direction:column;gap:10px}
.hm-head{display:flex;align-items:baseline;padding:0 4px;min-height:24px}
.hm-head>:first-child{flex:1}
.hm-head.tap{width:auto;position:relative}
.hm-head.tap::after{content:"";position:absolute;left:0;right:0;top:-10px;bottom:-10px}
.hm-strip{display:flex;gap:10px;margin-right:-16px;padding-right:16px;overflow-x:auto;scrollbar-width:none}
.hm-strip::-webkit-scrollbar{display:none}
.hm-when{width:150px;flex:none;background:var(--surface);border:0;border-radius:20px;padding:14px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;box-shadow:var(--shadow-1);text-align:left;color:inherit;cursor:pointer}
.hm-when-time{font-size:26px;line-height:32px;font-weight:700;color:var(--ink)}
.hm-when-what{font-size:14px;color:var(--text);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hm-when-rep{display:flex;align-items:center;gap:3px}
.hm-when-rep .i{width:12px;height:12px}
.hm-card{padding:14px}
.hm-chips{display:flex;flex-wrap:wrap;gap:8px}
.hm-chip{height:34px;padding:0 13px;border-radius:17px;background:var(--surface-2);font-size:14px;color:var(--text);display:inline-flex;align-items:center;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.hm-chip.urgent{background:var(--err-soft);color:var(--err)}
.hm-chip.more{color:var(--text-3)}
.hm-word{font-weight:600;color:var(--you-text)}
.hm-root .li .lt .t .hm-word{font-weight:600}
.hm-cells{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.hm-cell{background:var(--surface);border:0;border-radius:20px;padding:14px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;box-shadow:var(--shadow-1);text-align:left;color:inherit;cursor:pointer;min-height:44px}
.hm-cell-ic{width:34px;height:34px;border-radius:11px}
.hm-cell-t{display:flex;flex-direction:column}
.hm-cell-name{font-size:15px;font-weight:600;color:var(--ink)}
.hm-quote{padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px}
.hm-quote-mark{font-size:40px;line-height:20px;height:20px;color:var(--her-fill);font-weight:700}
.hm-quote-text{font-size:15.5px;line-height:26px;color:var(--text)}
.hm-quote-hint{border:0;background:none;padding:0;text-align:left;cursor:pointer;min-height:28px}
.hm-back .hm-backttl{font-weight:600}
.hm-plain{box-shadow:none;background:transparent;border:1px solid var(--line)}
.hm-plain .lic{background:transparent}
.hm-plain .lic .i{color:var(--text-2)}
.hm-plain .lt .t{font-size:15px}
.hm-danger{color:var(--err);margin-top:4px}
.hm-pause-box{display:flex;flex-direction:column;gap:8px}

/* ---------- pages under the home page ---------- */
.hm-stack{display:flex;flex-direction:column;gap:14px}
.hm-big{font-size:20px;line-height:28px;font-weight:700;color:var(--ink)}
.hm-pre{margin:0;padding:12px 14px;border-radius:14px;background:var(--code-bg);font:12.5px/19px var(--mono);color:var(--text);white-space:pre-wrap;overflow-wrap:anywhere}
.hm-inline input{flex:1;min-width:0;width:auto}
.hm-left{align-self:flex-start}
.hm-root .btn-ghost.hm-left{padding:0}
.hm-bar-btn{width:auto;min-width:52px;padding:0}
.hm-retry{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.hm-cardbtn{border:0;background:none;padding:0;text-align:left;width:100%;cursor:pointer;font:inherit;color:inherit}
.hm-original{margin:0;padding:12px;border-radius:12px;background:var(--code-bg);font:12.5px/19px var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text)}
.hm-wide{max-width:none}
.hm-custom{flex:1;min-width:0;width:auto}
.hm-evrow{display:flex;flex-direction:column}
.hm-evidence{padding:0 14px 12px 54px}
.hm-evidence .hm-ev{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:12px;background:var(--surface-2)}
.hm-evidence .hm-ev-row{display:flex;flex-direction:column;gap:2px}
.hm-evidence .hm-ev-label{font-size:12px;color:var(--text-3)}
.hm-evidence .hm-ev-value{font-size:13.5px;line-height:20px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text)}

/* activity */
.hm-activity{display:flex;flex-direction:column;gap:12px}
.hm-chips-row{display:flex;gap:8px;overflow-x:auto;margin:-5px -16px;padding:7px 16px 11px;scrollbar-width:none}

.hm-daychip{height:34px;padding:0 14px;border-radius:17px;border:0;background:var(--surface-2);color:var(--text-2);font-size:13.5px;flex:none;cursor:pointer}

.hm-timeline{display:flex;flex-direction:column}

.hm-dot{width:10px;height:10px;border-radius:50%;margin-top:5px;box-sizing:border-box;background:var(--text-3)}
.hm-dot.running{background:transparent;border:2px solid var(--her-fill)}
.hm-dot.completed{background:var(--ok-fill)}.hm-dot.error{background:var(--err-fill)}

.hm-steps{list-style:none;margin:0;padding:10px 12px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow-1);display:flex;flex-direction:column;gap:6px;font-size:13px;line-height:19px}

.hm-detail summary{color:var(--text-3);cursor:pointer;min-height:28px;display:flex;align-items:center}
.hm-detail pre{margin:4px 0;padding:8px 10px;border-radius:10px;background:var(--code-bg);white-space:pre-wrap;overflow-wrap:anywhere;font:12px/18px var(--mono);max-height:240px;overflow:auto}
.hm-ask{align-self:flex-start;padding:0}
.hm-bgrow{display:flex;align-items:center;gap:10px;margin-top:4px;padding:12px 14px;border:0;border-radius:16px;background:var(--her-soft);text-align:left;width:100%;cursor:pointer;color:inherit}
.hm-bgrow-t{flex:1;display:flex;flex-direction:column;font-size:14px;color:var(--ink)}
.hm-bgrow-t b{font-weight:600}
.hm-bgbox{display:flex;flex-direction:column;padding-top:14px}

/* upcoming */
.hm-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.hm-weekday{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:16px;border:0;background:transparent;cursor:pointer;color:inherit}
.hm-wd-name{font-size:11.5px;color:var(--text-3)}
.hm-wd-num{font-size:17px;font-weight:650;color:var(--ink)}
.hm-wd-dot{width:5px;height:5px;border-radius:50%;background:transparent}
.hm-wd-dot.has{background:var(--you)}
.hm-weekday.on{background:var(--you)}
.hm-weekday.on .hm-wd-name,.hm-weekday.on .hm-wd-num{color:var(--on-you)}
.hm-weekday.on .hm-wd-dot.has{background:var(--on-you)}
.hm-plan{flex-wrap:wrap}
.hm-plan-time{width:62px;font-size:22px;font-weight:700;color:var(--ink)}
.hm-plan-rep{display:flex;align-items:center;gap:4px}
.hm-plan-rep .i{width:12px;height:12px}
.hm-plan-warn{width:100%;padding-left:74px}
.hm-trash{color:var(--text-3)}

/* memory / identity */
.hm-doc{display:flex;flex-direction:column;gap:14px}
.hm-foot{margin:0}
.hm-source{display:block}
.hm-editor{display:flex;flex-direction:column;gap:10px}
.li-row{min-height:48px}
.li-row .lt .t{font-size:15px}
.hm-doc-card{padding:20px 20px 18px}
.hm-doc-body{display:flex;flex-direction:column;gap:12px;font-size:15.5px;line-height:27px;color:var(--text)}
.hm-doc-h{font-size:17px;font-weight:650;color:var(--ink);line-height:26px}
.hm-doc-ul{margin:0;padding-left:20px}
.hm-doc-sig{align-self:flex-end;color:var(--text-3);font-size:14px;line-height:22px}
.hm-doc-empty{color:var(--text-3)}
.hm-idcard{position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;padding:20px;border-radius:24px;background:var(--bubble-me);box-shadow:var(--shadow-2)}
.hm-idring{position:absolute;right:-40px;top:-60px;width:200px;height:200px;border-radius:50%;border:18px solid var(--her-soft)}
.hm-id-t{position:relative;display:flex;flex-direction:column;gap:4px;min-width:0}
.hm-id-name{font-size:22px;font-weight:700;color:var(--on-me)}
.hm-id-sub{font-size:13px;color:var(--on-me);opacity:.75}

/* promises */
.hm-promise{padding:16px;display:flex;flex-direction:column;gap:10px}
.hm-promise-ttl{display:flex;align-items:center;gap:8px}
.hm-promise-ttl .hm-pen{margin-left:auto;width:44px;height:44px;margin-right:-10px}
.hm-sentence{font-size:18px;line-height:30px;color:var(--ink)}
.hm-sentence.plain{font-size:15px;line-height:24px;color:var(--text);white-space:pre-wrap}
.hm-pill{font:inherit;font-weight:650;position:relative;display:inline-block;padding:2px 10px;border-radius:10px;background:var(--you-soft);color:var(--you-text);font-weight:650;cursor:pointer}
.hm-pill input{position:absolute;inset:0;width:100%;height:100%;opacity:0;padding:0;border:0;cursor:pointer}
.hm-rule{display:flex;align-items:center;gap:8px;min-height:44px}
.hm-rule-t{flex:1;min-width:0;display:flex;flex-direction:column;font-size:14.5px;color:var(--text)}
.hm-prefs{display:flex;flex-direction:column;gap:10px}
.hm-switchrow{min-height:56px}

/* hands */
.hm-checkhead{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;text-align:left;color:inherit;width:100%;cursor:pointer;min-height:44px}
.hm-checkicon{width:24px;height:24px;color:var(--ok);display:flex}
.hm-checkicon.bad{color:var(--warn)}
.hm-checkt{flex:1;display:flex;flex-direction:column}
.hm-parts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.hm-part{padding:10px 12px;border-radius:14px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px;border:0;text-align:left;color:inherit;cursor:pointer;min-height:44px}

.hm-part-name{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2)}

/* apps */
.hm-appgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 8px;padding:8px 0}

.hm-appic{position:relative;display:block}
.hm-apptile{display:flex;align-items:center;justify-content:center;width:62px;height:62px;border-radius:19px;font-size:26px;font-weight:700;box-shadow:var(--shadow-1)}
.hm-apptile.off{opacity:.35}
.hm-apptile.big{width:88px;height:88px;border-radius:27px;font-size:36px;align-self:center}
.hm-appbad{position:absolute;top:-3px;right:-3px;width:14px;height:14px;border-radius:50%;background:var(--err-fill);border:2.5px solid var(--bg)}
.hm-appname{font-size:12px;line-height:16px;color:var(--ink);text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hm-bannerwarn{margin:0;background:var(--warn-soft);color:var(--warn)}
.hm-appdetail{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:8px 0}
.hm-empty{align-items:center;text-align:center;padding:32px 20px;display:flex;flex-direction:column;gap:10px}

/* backstage */
.hm-spend{padding:16px;display:flex;align-items:flex-end;gap:12px}

<style>
*{box-sizing:border-box}html,body{height:100%}
