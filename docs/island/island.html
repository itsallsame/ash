<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ash 灵动岛 · 参考实现</title>
<!--
  Ash 灵动岛参考实现：纯 HTML/CSS/JS，无依赖。
  - 样式、尺寸、动效、交互与设计稿一致，可直接复用（例如 overlay 里放 WebView 加载），
    也可作为原生 Kotlin 实现的像素/行为基准。
  - 头像路径：./avatars/*.webp（即 packages/web/avatars），放在同目录或改 AVATAR_ROOT。
  - 组件 API：mountIsland(el, handlers) → { render(model) }，model 见 renderIsland 注释。
  - 文件下半部分是演示用的手机框和场景切换，接入时可删除。
-->
<style>
:root{
  --island:#101011;--stroke:rgba(255,255,255,.06);--surface:#1A1A1C;--input:#1E1E21;--icon-btn:#1F1F22;--neutral-btn:#26262A;--divider:#222225;
  --text:#F2F2F4;--body:#E6E6E9;--text2:#A1A1A7;--ph:#7D7D83;
  --running:#5AD8DB;--needs:#F5A623;--needs-text:#FFD08A;--done:#2BB673;--done-text:#6FD9A4;--stop:#FF6B6B;--stop-text:#FF8A8A;--offline:#8D8D93;--primary:#3B74FF;
  --ease:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box}
body{margin:0;background:#141415;color:#ECECEE;font-family:-apple-system,system-ui,"PingFang SC","Noto Sans SC",sans-serif}

/* ---------- Island component ---------- */
.isl{position:relative;overflow:hidden;background:var(--island);color:var(--text);box-shadow:0 8px 16px rgba(0,0,0,.30),0 1px 3px rgba(0,0,0,.22),inset 0 0 0 1px var(--stroke);
  font-variant-numeric:tabular-nums;transition:width .5s var(--ease),border-radius .5s var(--ease)}
.isl[data-form=compact]{width:236px;height:40px;border-radius:20px}
.isl[data-form=compact][data-hug]{height:34px;border-radius:17px}
.isl[data-form=card]{width:362px;height:auto;border-radius:30px}
.isl[data-form=edge]{width:52px;height:52px;border-radius:26px}
.isl button{font:inherit;color:inherit;border:0;background:none;margin:0;padding:0;cursor:pointer}
.isl button:focus-visible,.isl input:focus{outline:2px solid var(--running);outline-offset:2px}
.isl-in{animation:islIn .34s .1s both ease-out}
@keyframes islIn{from{opacity:0;transform:translateY(-4px) scale(.98);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}

.isl .isl-compact{width:100%;height:100%;display:flex;align-items:center;gap:8px;padding:0 12px 0 6px}
.isl-av{border-radius:50%;object-fit:cover;object-position:50% 20%;background:#2A2A2D;flex:none;width:28px;height:28px}
.isl[data-hug] .isl-compact .isl-av{width:24px;height:24px}
.isl-label{font-size:13.5px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.isl-time{font-size:12.5px;color:var(--text2);white-space:nowrap}
.isl-spacer{flex:1;min-width:20px}
.isl-ind{width:18px;height:18px;display:flex;align-items:center;justify-content:center;flex:none}

.ind-bars{display:flex;align-items:center;gap:2px;height:18px}
.ind-bars i{width:3px;height:6px;border-radius:2px;background:var(--tone);animation:bar .9s ease-in-out infinite}
.ind-bars i:nth-child(1){animation-delay:-.3s}.ind-bars i:nth-child(2){animation-delay:-.6s}.ind-bars i:nth-child(3){animation-delay:-.1s}.ind-bars i:nth-child(4){animation-delay:-.45s}
@keyframes bar{0%,100%{height:5px}50%{height:15px}}
.ind-dots{display:flex;align-items:center;gap:2px}
.ind-dots i{width:4px;height:4px;border-radius:50%;background:var(--tone);animation:dot 1.2s ease-in-out infinite}
.ind-dots i:nth-child(2){animation-delay:.2s}.ind-dots i:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,100%{opacity:.25;transform:scale(.75)}50%{opacity:1;transform:scale(1)}}
.ind-spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.pulse{animation:pulse 1.4s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(245,166,35,.55)}100%{box-shadow:0 0 0 7px rgba(245,166,35,0)}}
.ind-pulse{width:9px;height:9px;border-radius:50%;background:var(--tone)}
.ind-stop{width:10px;height:10px;border-radius:2.5px;background:var(--tone)}

.isl-card{display:flex;flex-direction:column;gap:14px;padding:16px 16px 10px}
.card-head{display:flex;align-items:center;gap:12px}
.card-head .isl-av{width:40px;height:40px;border-radius:14px;object-position:50% 15%}
.card-titles{display:flex;flex-direction:column;gap:1px;flex:1;min-width:0}
.card-title{display:flex;align-items:center;gap:7px;font-size:16px;font-weight:650}
.card-title .dot{width:8px;height:8px;border-radius:50%;background:var(--tone);flex:none}
.card-meta{font-size:12px;color:var(--text2)}
.icon-btn{width:44px;height:44px;border-radius:22px;background:var(--icon-btn)!important;color:#C9C9CE!important;display:flex;align-items:center;justify-content:center;flex:none}
.activity{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--surface)}
.activity b{display:block;font-size:15px;font-weight:600}
.activity span{display:block;font-size:12.5px;line-height:1.5;color:var(--text2)}
.body{margin:0;font-size:14.5px;line-height:1.6;color:var(--body);white-space:pre-line}
.body.clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden}
.quote{padding:12px 14px;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1px #2A2A2D;font-size:14px;line-height:1.55}
.more{align-self:flex-start;height:32px;color:var(--running)!important;font-size:13px!important}
.options{display:flex;flex-wrap:wrap;gap:8px}
.opt{height:44px;padding:0 16px!important;border-radius:22px;border:1.5px solid var(--needs)!important;background:rgba(245,166,35,.10)!important;color:var(--needs-text)!important;font-size:14px!important;font-weight:600!important}
.ap-row{display:flex;gap:8px}
.btn-primary{height:46px;border-radius:23px;background:var(--primary)!important;color:#fff!important;font-size:15px!important;font-weight:650!important}
.btn-neutral{height:46px;border-radius:23px;background:var(--neutral-btn)!important;color:#ECECEE!important;font-size:15px!important;font-weight:600!important}
.ap-approved{height:46px;border-radius:23px;background:rgba(43,182,115,.14)!important;color:var(--done-text)!important;font-size:15px!important;font-weight:600!important;display:flex;align-items:center;justify-content:center;gap:8px;cursor:default!important}
.ap-final{height:46px;border-radius:23px;background:var(--surface);color:#B4B4BA;font-size:14px;display:flex;align-items:center;justify-content:center}
.foot{display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--divider);padding-top:12px}
.foot-input{display:flex;align-items:center;gap:8px}
.foot-input label{flex:1;min-width:0;display:flex}
.foot-input input{width:100%;height:44px;border-radius:22px;border:0;background:var(--input);color:var(--text);font:inherit;font-size:14px;padding:0 16px}
.foot-input input::placeholder{color:var(--ph)}
.send{width:44px;height:44px;border-radius:22px;background:#2A2A2D!important;display:flex;align-items:center;justify-content:center;flex:none}
.foot-links{display:flex;align-items:center}
.foot-links button{height:44px;padding:0 12px!important;font-size:13.5px!important;color:#C9C9CE!important}
.foot-links .stop{color:var(--stop-text)!important;padding-left:4px!important;display:flex;align-items:center;gap:6px}
.foot-links .stop i{width:9px;height:9px;border-radius:2px;background:var(--stop-text)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.isl-edge{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.isl-edge .isl-av{width:42px;height:42px;box-shadow:0 0 0 2.5px var(--tone)}
@media (prefers-reduced-motion:reduce){.isl,.isl *{animation:none!important;transition:none!important}}

/* ---------- Demo harness (删掉即可) ---------- */
.demo{display:flex;gap:56px;padding:38px 48px;align-items:flex-start;flex-wrap:wrap}
.phone{width:410px;height:864px;border-radius:58px;background:#2A2A2D;padding:10px;flex:none}
.screen{position:relative;width:390px;height:844px;border-radius:48px;background:#F4F4F1;overflow:hidden}
.screen .bg{position:absolute;top:96px;left:20px;right:20px;display:flex;flex-direction:column;gap:14px}
.screen .bg div{height:12px;border-radius:6px;background:#E3E3DE}
.cam{position:absolute;top:16px;left:189px;width:12px;height:12px;border-radius:50%;background:#050505;z-index:3}
.pos{position:absolute;z-index:2;transition:left .5s var(--ease),top .5s var(--ease)}
.panel{flex:1;min-width:320px;display:flex;flex-direction:column;gap:18px}
.panel h1{margin:0;font-size:30px}
.panel .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.panel button{height:44px;border-radius:14px;border:1.5px solid #2A2A2D;background:#1B1B1D;color:#ECECEE;font:inherit;font-size:14px;cursor:pointer}
.panel button[aria-pressed=true]{border-color:var(--running);background:#232327}
.panel .row{display:flex;gap:6px;flex-wrap:wrap}.panel .row button{padding:0 14px}
.log{padding:14px 16px;border-radius:14px;background:#1B1B1D;border:1px solid #2A2A2D;font-size:13px;line-height:1.6}
.log code{color:#ECECEE}.log .n{color:#F5C46B}
</style>
</head>
<body>

<script>
/* =========================================================
   Island component
   model = {
     kind: 'listening'|'thinking'|'working'|'stale'|'ask'|'approval'|'in_app'|'result'|'incomplete'|'stopped',
     form: 'compact'|'card'|'edge',
     hugCamera: boolean,
     elapsed: seconds,
     activity: '在看网页'       // 执行类卡片的当前动作（只要动词）
     body: 'Agent 原话',        // 文本类卡片
     quote: '审批要提交的内容',  // approval
     options: ['A','B'],        // ask，仅来自原话 / 正式 ask
     approval: 'pending'|'approved'|'denied'|'expired'
   }
   handlers = { onTap, onOpen, onStop, onClose, onAllow, onDeny, onChoose(text), onSend(text), onViewOriginal }
   ========================================================= */
const AVATAR_ROOT = './avatars/';
const KIND = {
  listening:{label:'在听',title:'在听',face:'listening',ind:'bars',tone:'running',run:true,note:'刚收到你的消息'},
  thinking:{label:'在想',title:'正在处理',face:'thinking',ind:'dots',tone:'running',run:true,note:'你可以继续用手机，需要你时这里会展开'},
  working:{label:null,title:'正在处理',face:'focused',ind:'ring',tone:'running',run:true,note:'你可以继续用手机，需要你时这里会展开'},
  stale:{label:'连接中断',title:'连接中断',face:'default',ind:'off',tone:'offline',run:false,note:'100 秒没收到新状态，Ash 可能仍在运行'},
  ask:{label:'等你回答',title:'等你回答',face:'listening',ind:'pulse',tone:'needs',ph:'或者直接告诉 Ash…'},
  approval:{label:'需要批准',title:'需要你批准',face:'focused',ind:'pulse',tone:'needs'},
  in_app:{label:'去 Ash 操作',title:'需要你在 Ash 里操作',face:'listening',ind:'pulse',tone:'needs'},
  result:{label:'已完成',title:'已完成',face:'success',ind:'check',tone:'done',clamp:true},
  incomplete:{label:'未完成',title:'未完成',face:'thinking',ind:'warn',tone:'stop'},
  stopped:{label:'已停止',title:'已停止',face:'default',ind:'stop',tone:'stop'}
};
const TONE = {running:'#5AD8DB',needs:'#F5A623',done:'#2BB673',stop:'#FF6B6B',offline:'#8D8D93'};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SVG = {
  ring: t => `<svg class="ind-spin" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="7" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="2.4"/><circle cx="9" cy="9" r="7" fill="none" stroke="${t}" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="12 32"/></svg>`,
  check: (t, s=18) => `<svg width="${s}" height="${s}" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="8" fill="${t}"/><path d="M5.4 9.2l2.4 2.4 4.8-5" fill="none" stroke="#101011" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  warn: t => `<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="8" fill="${t}"/><path d="M9 5v5" stroke="#101011" stroke-width="2" stroke-linecap="round"/><circle cx="9" cy="12.8" r="1.1" fill="#101011"/></svg>`,
  off: () => `<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="6.5" fill="none" stroke="#8D8D93" stroke-width="2" stroke-dasharray="3 3"/></svg>`,
  up: () => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>`,
  send: () => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="M6 11l6-6 6 6"/></svg>`,
  tick: () => `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`
};
function indicator(ind, tone) {
  switch (ind) {
    case 'bars': return '<span class="ind-bars"><i></i><i></i><i></i><i></i></span>';
    case 'dots': return '<span class="ind-dots"><i></i><i></i><i></i></span>';
    case 'ring': return SVG.ring(tone);
    case 'pulse': return '<span class="ind-pulse pulse"></span>';
    case 'check': return SVG.check(tone);
    case 'warn': return SVG.warn(tone);
    case 'stop': return '<span class="ind-stop"></span>';
    default: return SVG.off();
  }
}
function fmt(sec) {
  const e = Math.floor((sec || 0) / 5) * 5, m = Math.floor(e / 60), s = String(e % 60).padStart(2, '0');
  return { short: `${m}:${s}`, long: m ? `${m} 分 ${s} 秒` : `${e} 秒` };
}

function renderIsland(m, ui) {
  const k = KIND[m.kind] || KIND.working;
  const ap = m.kind === 'approval' ? (m.approval || 'pending') : '';
  let label = k.label || m.activity || '在忙', toneKey = k.tone, ind = k.ind;
  if (ap === 'approved') { label = '已批准'; toneKey = 'done'; ind = 'check'; }
  if (ap === 'denied' || ap === 'expired') { label = ap === 'denied' ? '已拒绝' : '审批已过期'; toneKey = 'offline'; ind = 'off'; }
  const tone = TONE[toneKey];
  const needsYou = toneKey === 'needs';
  const t = fmt(m.elapsed);
  const face = `${AVATAR_ROOT}${k.face}.webp`;
  const aria = esc(`Ash：${label}，点按展开`);

  if (m.form === 'compact') return `
    <button class="isl-compact isl-in" data-act="tap" aria-label="${aria}">
      <img class="isl-av" src="${face}" alt="">
      <span class="isl-label">${esc(label)}</span>
      <span class="isl-spacer"></span>
      ${k.run || m.kind === 'stale' ? `<span class="isl-time">${t.short}</span>` : ''}
      <span class="isl-ind">${indicator(ind, tone)}</span>
    </button>`;

  if (m.form === 'edge') return `
    <button class="isl-edge" data-act="tap" aria-label="${aria}"><img class="isl-av" src="${face}" alt=""></button>`;

  const isText = !k.run && m.kind !== 'stale';
  const meta = k.run ? `已用 ${t.long}` : ['result', 'stopped', 'incomplete'].includes(m.kind) ? `用时 ${t.long}` : '刚刚';
  const clamp = k.clamp && !ui.more;
  let middle;
  if (!isText) {
    middle = `<div class="activity">${indicator(ind === 'bars' ? 'dots' : ind, tone)}<span><b>${esc(m.kind === 'stale' ? '状态待确认' : (m.activity || k.label || '在忙'))}</b><span>${esc(k.note)}</span></span></div>`;
  } else {
    middle = `<div style="display:flex;flex-direction:column;gap:8px">
      <p class="body${clamp ? ' clamp' : ''}">${esc(m.body)}</p>
      ${m.quote ? `<div class="quote">${esc(m.quote)}</div>` : ''}
      ${m.kind === 'approval' ? `<button class="more" data-act="original">查看完整原文</button>` : k.clamp ? `<button class="more" data-act="more">${ui.more ? '收起' : '展开全文'}</button>` : ''}
    </div>`;
  }
  let action = '';
  if (m.kind === 'ask' && m.options?.length)
    action = `<div class="options">${m.options.map((o, i) => `<button class="opt" data-act="choose" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
  if (ap === 'pending') action = `<div class="ap-row"><button class="btn-primary" style="flex:1.4" data-act="allow">允许并继续</button><button class="btn-neutral" style="flex:1" data-act="deny">拒绝</button></div>`;
  if (ap === 'approved') action = `<button class="ap-approved" disabled>${SVG.tick()}已批准，等待继续</button>`;
  if (ap === 'denied') action = `<div class="ap-final">已拒绝 · 这一步不会执行</div>`;
  if (ap === 'expired') action = `<div class="ap-final">已过期 · 未执行，需要时让 Ash 重新申请</div>`;
  if (m.kind === 'in_app') action = `<button class="btn-primary" data-act="open">去 Ash 里操作</button>`;

  return `
  <div class="isl-card isl-in">
    <div class="card-head">
      <img class="isl-av" src="${face}" alt="">
      <div class="card-titles">
        <span class="card-title"><span class="dot${needsYou ? ' pulse' : ''}"></span>${esc(k.title)}</span>
        <span class="card-meta">Ash · ${meta}</span>
      </div>
      <button class="icon-btn" data-act="tap" aria-label="收起成胶囊">${SVG.up()}</button>
    </div>
    ${middle}
    ${action}
    <div class="foot">
      <div class="foot-input">
        <label><span class="sr">回复 Ash</span><input type="text" placeholder="${esc(k.ph || '回复 Ash…')}"></label>
        <button class="send" data-act="send" aria-label="发送">${SVG.send()}</button>
      </div>
      <div class="foot-links">
        ${k.run ? '<button class="stop" data-act="stop"><i></i>停止任务</button>' : ''}
        <span style="flex:1"></span>
        <button data-act="open">回到 Ash</button>
        <button data-act="close" style="padding-right:4px!important">关闭</button>
      </div>
    </div>
  </div>`;
}

function mountIsland(root, handlers = {}) {
  const el = document.createElement('div');
  el.className = 'isl';
  root.appendChild(el);
  const ui = { more: false };
  let model = null;
  el.addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
    const act = b.dataset.act;
    if (act === 'more') { ui.more = !ui.more; return draw(); }
    if (act === 'choose') return handlers.onChoose?.(model.options[+b.dataset.i]);
    if (act === 'send') { const inp = el.querySelector('input'); const v = inp?.value.trim() || ''; if (inp) inp.value = ''; return handlers.onSend?.(v); }
    const map = { tap: 'onTap', open: 'onOpen', stop: 'onStop', close: 'onClose', allow: 'onAllow', deny: 'onDeny', original: 'onViewOriginal' };
    handlers[map[act]]?.();
  });
  el.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' && ev.target.matches('input')) el.querySelector('[data-act=send]')?.click(); });
  function draw() {
    el.dataset.form = model.form;
    if (model.hugCamera) el.dataset.hug = ''; else delete el.dataset.hug;
    el.style.setProperty('--tone', TONE[(KIND[model.kind] || KIND.working).tone]);
    el.innerHTML = renderIsland(model, ui);
  }
  return {
    el,
    render(next) {
      const contentChanged = !model || model.kind !== next.kind || model.form !== next.form || model.approval !== next.approval || model.body !== next.body;
      if (model && model.kind !== next.kind) ui.more = false;
      model = { ...next };
      if (contentChanged) draw();
      else { const time = el.querySelector('.isl-time, .card-meta'); draw(); void time; }
    }
  };
}
</script>

<!-- ================= Demo harness ================= -->
<div class="demo">
  <div class="phone"><div class="screen" id="screen">
    <div class="bg"><div style="height:200px;border-radius:22px"></div><div style="width:92%"></div><div style="width:78%"></div><div style="width:54%"></div><div style="height:120px;border-radius:22px;background:#E9E9E4"></div></div>
    <div class="pos" id="pos"></div>
    <div class="cam"></div>
  </div></div>
  <div class="panel">
    <h1>Ash 灵动岛 · 参考实现</h1>
    <div class="grid" id="kinds"></div>
    <div class="row" id="aps"></div>
    <div class="row" id="forms"></div>
    <div class="row" id="poss"></div>
    <div class="log" id="log"></div>
  </div>
</div>
<script>
const SAMPLE = {
  working: { activity: '在看网页' },
  thinking: { activity: '在想' },
  ask: { body: '找到两个周六还有空位的营地：\n1. 西溪湿地旁的森林营地，离家 40 分钟\n2. 千岛湖湖畔营地，车程 2.5 小时\n你想订哪一个？', options: ['西溪那个', '千岛湖那个'] },
  approval: { body: '要用微信给「小李」发送这条消息：', quote: '周六去西溪森林营地，我订了两人位，早上 9 点出发。' },
  in_app: { body: '订营地要先登录美团账号，需要你在 Ash 里扫码确认，我在这里等你。' },
  result: { body: '已经发给小李了。营地订单在美团「我的订单」里，取消规则是提前 24 小时免费。周五晚上我会提醒你带帐篷和防潮垫。\n\n另外，周六下午西溪有阵雨的可能，建议把出发时间提前到 8 点半。' },
  incomplete: { body: '付款页要求短信验证码，我这边收不到。你可以把验证码直接发给我，或者回 Ash 我带你操作。' },
  stopped: { body: '这次任务已经停下，后面的步骤没有执行。' }
};
const RUN = ['listening', 'thinking', 'working', 'stale'];
const S = { kind: 'working', form: 'compact', hug: false, elapsed: 35, approval: 'pending', hidden: false, notice: '' };
let t1, t2;
const clear = () => { clearTimeout(t1); clearTimeout(t2); };
const island = mountIsland(document.getElementById('pos'), {
  onTap: () => set({ form: S.form === 'card' ? 'compact' : 'card', notice: '' }),
  onClose: () => {
    const needs = ['ask', 'in_app', 'incomplete'].includes(S.kind) || (S.kind === 'approval' && S.approval === 'pending');
    if (RUN.includes(S.kind)) set({ form: 'compact' });
    else if (needs) set({ form: 'compact', notice: '卡片已收起：任务没有取消，事项还在胶囊里等你' });
    else set({ hidden: true, notice: '卡片已关闭：内容在 Ash 对话里能找到' });
  },
  onChoose: (t) => { pick('working', `「${t}」已回到对应的提问，Ash 继续`); t1 = setTimeout(() => pick('approval'), 3000); },
  onAllow: () => { clear(); set({ approval: 'approved', notice: '只批准这一次操作；Ash 会重新核对现场再继续' });
    t1 = setTimeout(() => { pick('working', '已批准，Ash 正在继续'); t2 = setTimeout(() => pick('result'), 3000); }, 1800); },
  onDeny: () => { clear(); set({ approval: 'denied', notice: '已拒绝：这一步不会执行' }); },
  onSend: (v) => pick('working', v ? `已发送：${v}` : '已发送给 Ash'),
  onStop: () => pick('stopped', '停止任务是单独的动作，和关闭卡片不同'),
  onOpen: () => { clear(); set({ hidden: true, notice: '已回到 Ash：首页可见时胶囊自动隐藏' }); },
  onViewOriginal: () => set({ notice: '打开审批的完整原文（在 Ash 里或展开）' })
});
function pick(kind, notice = '') {
  clear();
  const run = RUN.includes(kind);
  const form = run ? (S.form === 'card' || S.form === 'edge' ? S.form : 'compact') : 'card';
  const ended = ['result', 'stopped', 'incomplete'].includes(S.kind);
  set({ kind, form, approval: 'pending', hidden: false, notice, elapsed: ended && run ? 0 : S.elapsed });
}
function set(p) { Object.assign(S, p); draw(); }
function draw() {
  const pos = document.getElementById('pos');
  pos.style.display = S.hidden ? 'none' : '';
  const W = { compact: 236, card: 362, edge: 52 }[S.form];
  pos.style.left = (S.form === 'edge' ? 390 - 52 - 8 : (390 - W) / 2) + 'px';
  pos.style.top = (S.form === 'edge' ? 300 : S.hug ? 5 : 48) + 'px';
  island.render({ kind: S.kind, form: S.form, hugCamera: S.hug, elapsed: S.elapsed, approval: S.approval, ...SAMPLE[S.kind] });
  const btns = (id, items, cur, fn) => { document.getElementById(id).innerHTML = items.map(([v, l]) => `<button data-v="${v}" aria-pressed="${String(v) === String(cur)}">${l}</button>`).join(''); document.getElementById(id).onclick = e => { const b = e.target.closest('button'); if (b) fn(b.dataset.v); }; };
  btns('kinds', [['thinking','在想'],['working','执行中'],['ask','等你回答'],['approval','需要你批准'],['in_app','需要去 Ash 操作'],['result','已完成'],['incomplete','未完成'],['stale','连接中断']], S.kind, v => pick(v));
  btns('aps', [['pending','待审批'],['approved','已批准'],['denied','已拒绝'],['expired','已过期']], S.kind === 'approval' ? S.approval : '', v => { clear(); set({ kind: 'approval', approval: v, form: 'card', hidden: false, notice: '' }); });
  btns('forms', [['compact','胶囊'],['card','卡片'],['edge','贴边']], S.form, v => set({ form: v, hidden: false }));
  btns('poss', [['false','状态栏下方'],['true','贴摄像头']], S.hug, v => set({ hug: v === 'true' }));
  const FR = { thinking:'thinking', working:'working', ask:'waiting_you · 正式 ask', approval:`waiting_you · gate 审批 · ${S.approval}`, in_app:'done · JEV: 需要在 App 中操作', result:'done · JEV: 已交付', incomplete:'done · JEV: 未完成', stopped:'done · cancelled', stale:'stale · can_stop false' };
  document.getElementById('log').innerHTML = `底层状态：<code>${FR[S.kind]}</code>${S.notice ? `<br><span class="n">${esc(S.notice)}</span>` : ''}`;
}
setInterval(() => { if (['thinking', 'working', 'listening'].includes(S.kind) && !S.hidden) { S.elapsed++; if (S.elapsed % 5 === 0) draw(); } }, 1000);
draw();
</script>
