<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF8F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1715" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Ash</title>
<!--
  The app shell is bundled into this page at build time. It uses the same
  documented HTTP and event-stream routes locally and through a paired gateway.
-->
<!-- ash-style -->
<style>
*{box-sizing:border-box}html,body{height:100%}
/* Motion, from design/app/tokens.json "motion": a message rises in 240 ms, an answered card folds in 300 ms, a sheet slides in 360 ms. */
:root{--dur-message:240ms;--dur-resolve:300ms;--dur-sheet:360ms}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 var(--font);display:flex;flex-direction:column}
button,input,textarea,select{font-family:inherit}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* The design's components inherit the browser's normal line height; the older pages below were written for 1.55. */
header.topbar,#log,.dock,#composerDock,.layer{line-height:normal}
/* The design draws these with the browser's default box model (padding and border outside the size). */
.spinner,.pill,.av .dot,.codeblk .hd{box-sizing:content-box}
:focus-visible{outline:2px solid var(--you);outline-offset:2px}
/* ---- top bar: her, and the apps ---- */
header.topbar{position:relative;flex:none;z-index:2;height:auto;min-height:calc(56px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);max-width:760px;width:100%;margin:0 auto}
#presence{cursor:pointer;border-radius:var(--r-sm)}
#identity{display:flex;flex-direction:column;min-width:0}
#state,#stateNet{min-height:16px}
#stateNet{display:none}
#presence[data-net=connecting] #state,#presence[data-net=offline] #state{display:none}
#presence[data-net=connecting] #stateNet,#presence[data-net=offline] #stateNet{display:flex}
#presence[data-net=offline] #face{opacity:.55}
.av .dot.gone{display:none}
#presence[data-state=working][data-net=online] #state::before,#stateNet[data-kind=connecting]::before{content:"";flex:none;width:11px;height:11px;border-radius:50%;border:1.6px solid var(--her-soft);border-top-color:var(--her-fill);animation:spin .9s linear infinite}
#stateNet[data-kind=connecting]::before{border-color:var(--surface-3);border-top-color:var(--text-3)}
#presence[data-state=waiting_you][data-net=online] #state::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--warn-fill)}
#presence[data-state=thinking][data-net=online] #state::after{content:"";flex:none;width:4px;height:4px;margin-right:14px;border-radius:50%;background:currentColor;box-shadow:7px 0 currentColor,14px 0 currentColor;animation:dots 1.2s ease-in-out infinite}
#presenceNotice{position:absolute;top:100%;left:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xs);padding:4px 10px;font-size:12px;color:var(--text-2)}
#presenceNotice:empty{display:none}
#netBanner{max-width:732px;width:calc(100% - 28px);margin:0 auto 6px;background:var(--surface-2);color:var(--text-2)}
#netBanner span:last-child{flex:1}
#netBanner .i{color:var(--text-2)}
/* ---- the conversation ---- */
#log{max-width:760px;width:100%;margin:0 auto;overflow-y:auto;overflow-x:hidden;justify-content:flex-start;gap:3px;overscroll-behavior:contain}
#log::before{content:"";flex:1 1 0;min-height:0}
#log>*{flex:none}
.msg{white-space:pre-wrap;overflow-wrap:anywhere;position:relative}
.msg.me{align-self:flex-end}
.msg.ai{align-self:flex-start;white-space:normal}
.msg.ai:has(.md-code-block,.md-table-wrap){max-width:92%}
.msg.run-start{margin-top:15px}
#log>.msg.me:not(.run-start){margin-top:1px}
#log>.msg.ai:not(.run-start){margin-top:0}
.msg.enter,.a-card.enter{animation:rise var(--dur-message) var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.msg.waiting{opacity:.7}
.from{align-self:flex-end;font-size:11.5px;line-height:16px;color:var(--text-3);padding:0 6px}
.delivery.r,.meta-pending.r{align-self:flex-end}
.meta-pending{display:flex;align-items:center;gap:4px}
.byline .av-letter{width:20px;height:20px;font-size:11px;flex:none}
.byline{align-self:flex-start;margin-top:15px}
.fill-her{background:var(--her)}.fill-you{background:var(--you)}.fill-warn{background:var(--warn-fill)}.fill-ok{background:var(--ok-fill)}
.av-letter{color:var(--on-you)}
.expand{display:block;position:relative;margin-top:6px;border:0;background:none;padding:0;color:var(--you-text);font:inherit;font-size:13px;line-height:20px;cursor:pointer}
.expand::after{content:"";position:absolute;inset:-12px -14px}
.reactions{display:flex;gap:4px;margin-top:6px}.reaction{background:var(--surface-2);border-radius:var(--r-pill);padding:0 6px;font-size:13px;line-height:20px}
.atts{display:flex;flex-direction:column;gap:6px}
.atts.me{align-self:flex-end;align-items:flex-end}.atts.ai{align-self:flex-start;align-items:flex-start}
.atts.run-start{margin-top:15px}
.atts img{display:block;max-width:200px;max-height:150px;border-radius:var(--r-md)}
.att-file{cursor:pointer;font:inherit;color:var(--ink);text-align:left;max-width:100%}
.att-file:disabled{opacity:.6}
.att-file .attachment-name,.att-file .card-file-name{font-size:14px;line-height:20px;overflow-wrap:anywhere;min-width:0}
.card-file{width:100%;min-width:0;border:0;background:none;padding:0;min-height:44px}
.daysep{flex:none}
.markdown{white-space:normal;min-width:0;overflow-wrap:anywhere}
.markdown>:first-child{margin-top:0}.markdown>:last-child{margin-bottom:0}
.markdown h1,.markdown h2,.markdown h3,.markdown h4,.markdown h5,.markdown h6{margin:10px 0 6px;font-size:16px;line-height:24px;font-weight:650;color:var(--ink)}
.markdown p{margin:0 0 8px}
.markdown ul,.markdown ol{margin:4px 0 8px;padding-left:20px}.markdown li{margin:2px 0}.markdown li>p{margin:2px 0}.markdown li>ul,.markdown li>ol{margin:2px 0}
.markdown blockquote{margin:8px 0;padding:0 0 0 12px;border-left:3px solid var(--line-2);color:var(--text-2)}
.markdown hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.markdown a{color:var(--you-text);text-decoration:none;border-bottom:1px solid currentColor;overflow-wrap:anywhere}
.markdown strong{font-weight:600;color:var(--ink)}
.markdown pre code{padding:0;border-radius:0;background:none;font-size:inherit;white-space:pre}
.md-code-block{max-width:100%}
.md-code-bar{display:flex;justify-content:space-between;align-items:center}
.md-copy{position:relative;border:0;background:transparent;color:var(--text-3);font:inherit;min-width:28px;min-height:28px;padding:0 6px;cursor:pointer;border-radius:var(--r-xs);display:inline-flex;align-items:center;justify-content:center}
.md-copy::after{content:"";position:absolute;inset:-8px -8px}
.markdown .md-code-block pre{margin:0;padding:10px 12px;overflow-x:auto;tab-size:2}
.md-table-wrap{max-width:100%;overflow-x:auto;overscroll-behavior-x:contain}
.markdown .tbl th,.markdown .tbl td{min-width:5em;max-width:24em;overflow-wrap:normal}
.markdown .tbl th{border-bottom:0}
.markdown .md-task{list-style:none}.md-task input{margin-left:-20px;margin-right:6px;accent-color:var(--you);vertical-align:middle}
.md-image-link{font-size:14px}.md-plain{white-space:pre-wrap}.md-copy-buffer{position:fixed;left:-9999px;top:0;opacity:0}
/* ---- cards in the stream ---- */
#log>.a-card{align-self:flex-start;margin-top:15px}
#log>.a-card+.msg.run-start,#log>.a-card+.a-card{margin-top:15px}
.card-hd{min-height:24px}
.card-hd-text{min-width:0}
.chip-ic{flex:none}
.chip-ic.tile-her{background:var(--her-soft)}.chip-ic.tile-warn{background:var(--warn-soft)}.chip-ic.tile-err{background:var(--err-soft)}.chip-ic.tile-you{background:var(--you-soft)}
.a-card.slim{gap:6px;padding:10px 14px}
.a-card .card-body{white-space:pre-line;overflow-wrap:anywhere}
.a-card .card-body-text{color:var(--text)}
.a-card .card-open{color:var(--ink);text-decoration:none;overflow-wrap:anywhere}
.card-row{display:flex;gap:8px}
.a-card .opt{cursor:pointer;max-width:100%;text-align:left;height:auto;min-height:40px;padding-top:8px;padding-bottom:8px;line-height:21px}
.a-card .opt:disabled:not(.on):not(.dim){opacity:.5}
.say{min-height:40px}
.say .card-custom{flex:1;min-width:0;border:0;background:none;outline:0;color:var(--text);font:inherit;font-size:14px;padding:0}
.say .card-custom::placeholder{color:var(--text-3)}
.say .sbtn{border:0;flex:none;cursor:pointer;padding:0}
.say .sbtn:disabled{opacity:.5}
.a-card .approval-original{margin:0}
.a-card .approval-original summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:2px;min-height:28px;font-size:13px;color:var(--you-text)}
.a-card .approval-original summary::-webkit-details-marker{display:none}
.a-card .approval-original summary::after{content:"";width:6px;height:6px;margin-left:4px;border:solid currentColor;border-width:1.8px 1.8px 0 0;transform:rotate(45deg)}
.a-card .approval-original[open] summary::after{transform:rotate(135deg)}
.a-card .approval-original-text{max-height:50vh;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;unicode-bidi:plaintext;font:12.5px/19px var(--mono);margin:6px 0 0;padding:10px 12px;background:var(--code-bg);border-radius:var(--r-sm);color:var(--text)}
.a-card .card-note{white-space:normal}
.a-card .resolved svg{flex:none}
/* The design sizes some controls under 44px; an invisible margin keeps the touch area at 44px. */
.btn-sm,.opt,.sbtn,.pill,.expand,.suggestion button,.ctx .chip-clear,.context-chip button,.a-card .approval-original summary,.md-copy{position:relative}
.btn-sm::after,.pill::after,.field .to::after{content:"";position:absolute;inset:-5px}
.opt::after{content:"";position:absolute;inset:-4px}
.sbtn::after{content:"";position:absolute;inset:-7px}
.suggestion button::after,.ctx .chip-clear::after,.context-chip button::after{content:"";position:absolute;inset:-8px}
.a-card .approval-original summary::before{content:"";position:absolute;inset:-8px 0}
.a-btn{cursor:pointer}
.card-acts .a-btn{width:100%}
/* ---- loading, empty, first meeting ---- */
.sk{flex:none}
.sk-her-s{width:58%;height:44px;border-radius:var(--r-lg) var(--r-lg) var(--r-lg) 6px}
.sk-her-l{width:74%;height:92px;border-radius:var(--r-lg) var(--r-lg) var(--r-lg) 6px}
.sk-me-s{align-self:flex-end;width:46%;height:44px;border-radius:var(--r-lg) var(--r-lg) 6px var(--r-lg)}
.sk-her-m{width:66%;height:68px;border-radius:var(--r-lg) var(--r-lg) var(--r-lg) 6px}
.sk-me-m{align-self:flex-end;width:52%;height:44px;border-radius:var(--r-lg) var(--r-lg) 6px var(--r-lg)}
#log:has(>.sk){gap:10px}
#log:has(>.empty){padding:0}
#log:has(>.empty)::before{display:none}
#log>.empty{flex:1}
.empty-examples{display:flex;flex-direction:column;gap:6px;margin-top:4px;font-size:14px;line-height:21px;color:var(--text-2)}
.intro{display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 0 18px}
/* ---- over the composer ---- */
.dock[hidden]{display:none}
.dock:empty{display:none}
#progress .pill{cursor:pointer;font:inherit;font-size:12.5px}
.pill .pill-time{color:var(--text-2)}
.pill .i{color:var(--text-3)}
.context-chip button,.ctx .chip-clear{border:0;background:none;color:inherit;font:inherit;font-size:12.5px;min-width:28px;min-height:28px;padding:0 6px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r-pill)}
.suggestion button{border:0;background:none;color:inherit;font:inherit;font-size:12.5px;min-height:28px;padding:0 8px;cursor:pointer}
#suggestions:empty{display:none}
#suggestions{display:flex;justify-content:center;padding:6px 14px 2px;max-width:760px;margin:0 auto;width:100%}
.suggestion{height:auto;min-height:30px;padding:0 4px 0 12px}
#composerDock{flex:none;max-width:760px;width:100%;margin:0 auto}
.composer{padding-bottom:max(24px,env(safe-area-inset-bottom))}
.field textarea{flex:1;min-width:0;max-height:40vh;resize:none;border:0;background:none;outline:0;color:var(--text);font:inherit;font-size:15px;line-height:24px;padding:9px 0;margin:0;align-self:center}
.field textarea::placeholder{color:var(--text-3)}
.field{align-items:flex-end;min-width:0}
.field textarea{width:100%}
.field .to{align-self:flex-end;margin-bottom:4px;cursor:pointer}
.field .to img{display:block}
.field .to .to-letter{width:28px;height:28px;margin:3px;font-size:14px}
.plus,.send{cursor:pointer}
.send:disabled{opacity:.5}
/* ---- sheets over the page: who to talk to, what to attach ---- */
.layer{position:fixed;inset:0;z-index:4}
.layer .scrim{animation:fade var(--dur-sheet) var(--ease)}
.layer .sheet{max-width:760px;margin:0 auto;padding-bottom:max(28px,env(safe-area-inset-bottom));animation:slide var(--dur-sheet) var(--ease)}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateY(100%)}}
.layer .list{box-shadow:none;background:var(--surface-2)}
.layer .li{width:100%;border:0;background:none;font:inherit;color:inherit;text-align:left;cursor:pointer}
.layer .li:disabled{opacity:.5;cursor:default}
.layer .li .av-letter{width:40px;height:40px;font-size:17px}
.layer .li .chev-on{color:var(--you-text)}
.layer .li .dot{border-color:var(--surface-2)}
.layer .li.sk-row{height:56px;cursor:default}
.layer .li.sheet-note{color:var(--text-2);font-size:14px}
.attach-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:6px 0 4px}
.attach-choice{display:flex;flex-direction:column;align-items:center;gap:8px;border:0;background:none;font:inherit;font-size:13px;color:var(--text);cursor:pointer;min-height:44px}
.attach-tile{width:60px;height:60px;border-radius:var(--r-lg);background:var(--surface-2);display:flex;align-items:center;justify-content:center}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* Older pages, still in use: the settings drawer, the person sheet and the file browser. */
.btn{border:0;border-radius:8px;padding:.35rem .9rem;font:inherit;font-size:.9rem;cursor:pointer;background:var(--me);color:#fff;margin:.2rem .4rem .2rem 0}
.btn.gray{background:var(--chip);color:var(--fg)}.btn.red{background:var(--err-fill)}
.err{color:var(--err);font-size:.8rem;align-self:flex-start}
#drawer{position:fixed;inset:0 0 0 auto;width:min(420px,94vw);background:var(--bg);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .2s;z-index:5;overflow-y:auto;padding:0 1rem 2rem}
#drawer.open{transform:none;box-shadow:-8px 0 24px #0002}
#agentSheet{position:fixed;inset:0 0 0 auto;width:min(480px,100vw);background:var(--bg);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .2s;z-index:6;overflow-y:auto;padding:0 1rem calc(2.5rem + env(safe-area-inset-bottom))}
#agentSheet.open{transform:none;box-shadow:-8px 0 24px #0002}
#agentTopBar{position:sticky;top:0;z-index:3;display:flex;justify-content:flex-end;align-items:center;height:2.6rem;background:var(--bg)}
#agentClose{border:0;background:none;color:var(--me);font:inherit;font-size:.95rem;cursor:pointer;padding:.3rem 0}
#agentSheetHeader{display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 0 1.1rem}
#agentAvatar{display:block;width:100px;height:100px;border-radius:30px;background:var(--chip);object-fit:contain}
#agentSheetHeader h2{font-size:1.5rem;font-weight:700;line-height:1.25;margin:.75rem 0 .15rem;max-width:100%;overflow-wrap:anywhere}
#agentState{display:flex;align-items:center;gap:.4rem;margin:0;max-width:100%;color:var(--mute);font-size:.88rem}
#agentState::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--mute)}
#agentState[data-dot=idle]::before{background:var(--ok-fill)}#agentState[data-dot=running]::before{background:var(--warn-fill);animation:p 1s infinite}#agentState[data-dot=error]::before{background:var(--err-fill)}
#agentTabsBar{position:sticky;top:2.6rem;z-index:2;background:var(--bg);padding:.1rem 0 .5rem}
#agentTabs{display:flex;gap:2px;padding:3px;border-radius:11px;background:var(--chip)}
#agentTabs button{position:relative;flex:1;min-width:0;border:0;border-radius:8px;background:none;color:var(--mute);padding:.4rem 0;font:inherit;font-size:.88rem;cursor:pointer}
#agentTabs button[aria-selected=true]{background:var(--seg);color:var(--fg);font-weight:600;box-shadow:0 1px 3px #0000001f}
#agentTabs button[data-badge]:not([data-badge=""])::after{content:attr(data-badge);display:inline-block;vertical-align:.12em;margin-left:.2rem;min-width:1.05rem;height:1.05rem;padding:0 .28rem;border-radius:999px;background:var(--err-fill);color:#fff;font-size:.66rem;font-weight:600;line-height:1.05rem;box-sizing:border-box}
#agentPanel>section>:first-child{margin-top:.5rem}
#agentSheet .btn{margin:0;padding:.5rem 1.1rem;border-radius:10px;font-size:.92rem}#agentSheet .btn:disabled{opacity:.45;cursor:default}
#agentSheet .set-actions{flex-wrap:wrap;gap:.5rem;align-items:center}
.sheet-loading,.sheet-empty{color:var(--mute);font-size:.88rem;margin:.6rem .9rem}
.sheet-empty.set-card{margin:.6rem 0}
.set-group .sheet-loading,.set-group .sheet-empty,.set-group .sheet-unavailable{margin:0;color:var(--mute);font-size:.88rem}
#agentPanel .sheet-note{margin:-.1rem .9rem .55rem;font-size:.8rem}
.sheet-retry-button{margin-top:.9rem}
#agentPanel .sheet-status{margin:.6rem .9rem 0}
.sheet-retry{display:flex;flex-direction:column;align-items:flex-start;gap:.6rem;margin:.6rem 0;padding:.9rem;border-radius:14px;background:var(--card);color:var(--fg);font-size:.9rem}
.sheet-retry p{margin:0}
.sheet-link{border:0;background:none;color:var(--me);font:inherit;font-size:.84rem;padding:.2rem 0;cursor:pointer}
.sheet-link:disabled{color:var(--mute);cursor:default}
.sheet-error,.editor-warning{color:var(--err);font-size:.82rem;margin:.1rem 0;line-height:1.45}
.activity-turn{background:var(--card);border-radius:14px;padding:.8rem .9rem .65rem;margin:.5rem 0}
.activity-head{display:flex;align-items:baseline;gap:.7rem}
.activity-turn h3{flex:1;min-width:0;margin:0;font-size:.97rem;font-weight:600;line-height:1.4;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.activity-time{flex:none;color:var(--mute);font-size:.78rem;font-variant-numeric:tabular-nums}
.activity-steps{list-style:none;margin:.45rem 0 0;padding:0}
.activity-step{position:relative;margin:0;padding:.1rem 0 .1rem 1.05rem;color:var(--mute);font-size:.84rem;line-height:1.45;overflow-wrap:anywhere}
.activity-step::before{content:"";position:absolute;left:.15rem;top:.6em;width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.45}
.activity-step+.activity-step::after{content:"";position:absolute;left:calc(.15rem + 2.5px);top:-.45em;height:.85em;border-left:1px solid var(--line)}
.activity-step[data-state=pending]::before{background:none;border:1.5px solid var(--warn-fill);opacity:1;width:7px;height:7px}
.activity-step[data-state=failed]::before,.activity-step[data-state=error]::before{background:var(--err-fill);opacity:1}
.activity-step[hidden]{display:none}
.activity-step{padding-top:.45rem;padding-bottom:.55rem}
.activity-step-title{color:var(--fg);font-weight:500;line-height:1.55}
.activity-step-meta{font-size:.73rem;color:var(--mute);margin-top:.18rem}
.activity-detail{margin-top:.35rem;font-size:.76rem}
.activity-detail summary{cursor:pointer;color:var(--me)}
.activity-detail pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:45vh;overflow:auto;background:var(--chip);border-radius:8px;padding:.6rem;font-size:.73rem}
.activity-step[data-state=ok]::before{background:var(--ok-fill);opacity:1}
.activity-foot{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin-top:.55rem;padding-top:.5rem;border-top:1px solid var(--line)}
.activity-outcome{font-size:.8rem;color:var(--mute)}
.activity-outcome[data-outcome=completed]{color:var(--ok)}.activity-outcome[data-outcome=running]{color:var(--warn)}.activity-outcome[data-outcome=error]{color:var(--err)}
.activity-ask{border:0;background:none;color:var(--me);font:inherit;font-size:.8rem;padding:.15rem 0;cursor:pointer;white-space:nowrap}
.activity-more{border:0;background:none;color:var(--mute);font:inherit;font-size:.8rem;padding:.15rem 0 0 1.05rem;cursor:pointer}
button.activity-bg-toggle{display:flex;align-items:center;gap:.45rem;border:0;background:none;font:inherit;font-size:.8rem;font-weight:600;color:var(--mute);padding:0;cursor:pointer;text-align:left}
.activity-bg-toggle .set-chev{width:.42rem;height:.42rem;transition:transform .15s}.activity-bg-toggle[aria-expanded=true] .set-chev{transform:rotate(135deg)}
.activity-bg[hidden]{display:none}
.upcoming-timer{display:flex;align-items:center;gap:.85rem;padding:.75rem .9rem}
.upcoming-when{flex:none;min-width:3.1rem;font-size:1.12rem;font-weight:600;font-variant-numeric:tabular-nums}
